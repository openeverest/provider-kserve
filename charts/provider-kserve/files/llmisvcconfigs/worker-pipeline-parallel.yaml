# Multi-node pipeline-parallel preset for the llm topology (workerCount +
# pipelineParallelSize). KServe resolves this name for LLMInferenceServices with
# spec.worker and spec.parallelism.pipeline but does not ship it. Not synced
# from KServe; maintained here. vLLM runs one process per pod with its native
# multiprocessing multi-node mode (no Ray): the LWS leader is node rank 0 and
# serves the API, workers join it headless.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceServiceConfig
metadata:
  name: kserve-config-llm-worker-pipeline-parallel
  namespace: kserve
spec:
  annotations:
    serving.kserve.io/model-based-routing-enabled: "true"
  template:
    containers:
      - name: main
        image: ghcr.io/llm-d/llm-d-cuda:v0.8.0
        imagePullPolicy: IfNotPresent
        command:
          - /bin/bash
          - -c
          - |-
            LEADER_IP=${POD_IP}
            echo "node rank ${LWS_WORKER_INDEX:-0}/${LWS_GROUP_SIZE}, master ${LEADER_IP}"

            ACCESS_LOG_ARGS="--disable-uvicorn-access-log"
            VLLM_VERSION=$(vllm --version 2>/dev/null | tail -1 | awk '{print $NF}')
            if [[ "$VLLM_VERSION" =~ ^[0-9]+\.[0-9]+ ]] && [ "$(printf '%s\n%s\n' "0.16.0" "${VLLM_VERSION}" | sort -V | head -1)" = "0.16.0" ]; then
              ACCESS_LOG_ARGS="--disable-access-log-for-endpoints /health,/metrics,/ping"
            fi

            eval "exec vllm serve /mnt/models \
              --served-model-name "{{ .Spec.Model.Name }}" "publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name }}" \
              --port 8000 \
              --tensor-parallel-size {{ or .Spec.Parallelism.Tensor 1 }} \
              --pipeline-parallel-size {{ .Spec.Parallelism.Pipeline }} \
              --distributed-executor-backend mp \
              --nnodes ${LWS_GROUP_SIZE} \
              --node-rank ${LWS_WORKER_INDEX:-0} \
              --master-addr ${LEADER_IP} \
              --master-port ${VLLM_MASTER_PORT:-29501} \
              ${ACCESS_LOG_ARGS} \
              {{ if .GlobalConfig.EnableTLS }}--enable-ssl-refresh{{- end }} \
              {{ if .GlobalConfig.EnableTLS }}--ssl-certfile /var/run/kserve/tls/tls.crt{{- end }} \
              {{ if .GlobalConfig.EnableTLS }}--ssl-keyfile /var/run/kserve/tls/tls.key{{- end }} \
              ${VLLM_ADDITIONAL_ARGS} \
              $@"
          - --
        env:
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: HOME
            value: /home
          - name: VLLM_LOGGING_LEVEL
            value: INFO
          - name: HF_HUB_CACHE
            value: /models
        ports:
          - containerPort: 8000
            protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        lifecycle:
          preStop:
            exec:
              command:
                - /bin/sleep
                - "15"
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /health
            port: 8000
            scheme: '{{ if .GlobalConfig.EnableTLS }}HTTPS{{else}}HTTP{{- end }}'
          periodSeconds: 10
          timeoutSeconds: 1
        readinessProbe:
          failureThreshold: 2
          httpGet:
            path: /health
            port: 8000
            scheme: '{{ if .GlobalConfig.EnableTLS }}HTTPS{{else}}HTTP{{- end }}'
          periodSeconds: 1
          timeoutSeconds: 1
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /health
            port: 8000
            scheme: '{{ if .GlobalConfig.EnableTLS }}HTTPS{{else}}HTTP{{- end }}'
          periodSeconds: 10
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
          - mountPath: /home
            name: home
          - mountPath: /tmp
            name: tmp-dir
          - mountPath: /dev/shm
            name: dshm
          - mountPath: /models
            name: model-cache
          - mountPath: /var/run/kserve/tls
            name: tls-certs
            readOnly: true
    terminationGracePeriodSeconds: 60
    volumes:
      - emptyDir: {}
        name: home
      - emptyDir: {}
        name: tmp-dir
      - emptyDir:
          medium: Memory
          sizeLimit: 8Gi
        name: dshm
      - emptyDir: {}
        name: model-cache
      - name: tls-certs
        secret:
          secretName: '{{ ChildName .ObjectMeta.Name `-kserve-self-signed-certs` }}'
  worker:
    containers:
      - name: main
        image: ghcr.io/llm-d/llm-d-cuda:v0.8.0
        imagePullPolicy: IfNotPresent
        command:
          - /bin/bash
          - -c
          - |-
            # The leader's DNS record can lag its creation; retry before joining.
            for i in $(seq 1 ${LEADER_ADDRESS_RESOLVE_ATTEMPTS:-60}); do
              LEADER_IP=$(getent hosts ${LWS_LEADER_ADDRESS} | awk '{print $1}')
              [ -n "$LEADER_IP" ] && break
              sleep 2
            done
            LEADER_IP=${LEADER_IP:-$LWS_LEADER_ADDRESS}
            echo "node rank ${LWS_WORKER_INDEX}/${LWS_GROUP_SIZE}, master ${LEADER_IP}"

            eval "exec vllm serve /mnt/models \
              --served-model-name "{{ .Spec.Model.Name }}" "publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name }}" \
              --tensor-parallel-size {{ or .Spec.Parallelism.Tensor 1 }} \
              --pipeline-parallel-size {{ .Spec.Parallelism.Pipeline }} \
              --distributed-executor-backend mp \
              --nnodes ${LWS_GROUP_SIZE} \
              --node-rank ${LWS_WORKER_INDEX} \
              --master-addr ${LEADER_IP} \
              --master-port ${VLLM_MASTER_PORT:-29501} \
              --headless \
              ${VLLM_ADDITIONAL_ARGS} \
              $@"
          - --
        env:
          - name: HOME
            value: /home
          - name: VLLM_LOGGING_LEVEL
            value: INFO
          - name: HF_HUB_CACHE
            value: /models
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
          - mountPath: /home
            name: home
          - mountPath: /tmp
            name: tmp-dir
          - mountPath: /dev/shm
            name: dshm
          - mountPath: /models
            name: model-cache
    terminationGracePeriodSeconds: 60
    volumes:
      - emptyDir: {}
        name: home
      - emptyDir: {}
        name: tmp-dir
      - emptyDir:
          medium: Memory
          sizeLimit: 8Gi
        name: dshm
      - emptyDir: {}
        name: model-cache
