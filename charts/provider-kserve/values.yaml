# Default values for provider-kserve.

# -- Number of replicas for the provider deployment
replicaCount: 1

image:
  # -- Container image repository
  repository: ghcr.io/openeverest/provider-kserve-dev
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion
  tag: "latest"

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Override the name of the chart
nameOverride: ""
# -- Override the full name of the chart
fullnameOverride: ""

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- Automount API credentials for the service account
  automountServiceAccountToken: true
  # -- The name of the service account to use. If not set and create is true, a name is generated using the fullname template
  name: ""

rbac:
  # -- Specifies whether RBAC resources should be created
  create: true

# -- Annotations to add to the deployment pods
podAnnotations: {}

# -- Labels to add to the deployment pods
podLabels: {}

podSecurityContext:
  # -- Run as non-root
  runAsNonRoot: true
  # -- Security context fsGroup
  fsGroup: 65534

securityContext:
  # -- Disallow privilege escalation
  allowPrivilegeEscalation: false
  # -- Drop all capabilities
  capabilities:
    drop:
      - ALL
  # -- Read-only root filesystem
  readOnlyRootFilesystem: true
  # -- Run as non-root user
  runAsNonRoot: true
  # -- Run as user ID
  runAsUser: 65534

service:
  # -- Service type
  type: ClusterIP
  # -- Service port for the HTTP server (schema/validation endpoints)
  port: 8082

# -- Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# -- Node selector for pod scheduling
nodeSelector: {}

# -- Tolerations for pod scheduling
tolerations: []

# -- Affinity rules for pod scheduling
affinity: {}

provider:
  # -- The name to register for the Provider custom resource
  name: provider-kserve
  # -- Short identifier for the provider, used in resource names
  # This appears in preset names (e.g., '<shortName>-smollm-cpu') and can be
  # used in other contexts where a short concise provider identifier is needed.
  shortName: kserve

# -- Default cluster instance presets configuration
# Each preset must have 'name', 'enabled', and 'spec' fields.
# The 'spec' field contains the full ClusterInstancePresetSpec.
# Note: The provider shortName will be automatically added to each preset name.
presets:
  # smollm-cpu — a tiny, ungated model on CPU-only nodes. Sized for local
  # development and smoke tests (k3d/kind/minikube): no GPU required, and the
  # smallest instruct model in the catalog so it downloads and starts fast.
  - name: smollm-cpu
    enabled: true
    spec:
      providerRef:
        name: provider-kserve
      topology:
        type: llm
      components:
        llmEngine:
          type: vllm
          replicas: 1
          # Size memory generously even for a tiny model: vLLM's CPU runtime
          # (torch import + compilation) has a multi-GiB floor before the model
          # and KV cache load, so a tight limit fails vLLM's startup memory
          # check. Limits are mirrored into requests (Guaranteed QoS).
          resources:
            limits:
              cpu: "2"
              memory: 6Gi
          service:
            serviceType: ClusterIP
          parameters:
            modelURI: hf://HuggingFaceTB/SmolLM2-135M-Instruct
            modelName: smollm2-135m-instruct
            computeProfile: cpu

  # qwen-gpu — a small, ungated model on a single GPU. Qwen3-4B (~8 GB in bf16)
  # fits comfortably on one 16–24 GB card, needs no HuggingFace token, and starts
  # quickly. CPU/memory are host-side only: the weights and KV cache live in VRAM,
  # so the host just runs the Python/CUDA process and stages the model during
  # load. They are set as requests (burstable) — the nvidia.com/gpu limit is the
  # real gate, so there is no need for a large RAM limit here.
  - name: qwen-gpu
    enabled: true
    spec:
      providerRef:
        name: provider-kserve
      topology:
        type: llm
      components:
        llmEngine:
          type: vllm
          replicas: 1
          # GPU count is set via parameters.gpuCount below (the provider injects
          # the nvidia.com/gpu limit); cpu/memory are host-side requests only.
          resources:
            requests:
              cpu: "2"
              memory: 6Gi
          service:
            serviceType: ClusterIP
          parameters:
            modelURI: hf://Qwen/Qwen3-4B
            modelName: qwen3-4b
            computeProfile: gpu
            gpuCount: 1
            tensorParallelSize: 1

# ---------------------------------------------------------------------------
# LLM model catalog.
#
# This list is rendered into the Provider CR (spec.uiSchema.llm.modelCatalog) and
# surfaced in the "Model" dropdown of the `llm` topology form. Edit it to add, remove,
# or reorder models — changes take effect on `helm upgrade`, no regeneration
# needed. Each entry:
#   label: display name shown in the UI
#   uri:   model location (hf://..., s3://..., pvc://..., oci://... or
#          oci+native://... for a model packaged as a container image)
#   gated: (optional) true for models needing a HuggingFace token + access
#          approval. Gated entries get a "(gated)" suffix in the UI and require
#          `huggingface.tokenSecretName` to be set (see below).
# -- Models offered in the llm topology model picker
models:
  # --- Tiny, CPU-friendly ungated models (run without a GPU) ---
  - label: "SmolLM2 135M Instruct"
    uri: "hf://HuggingFaceTB/SmolLM2-135M-Instruct"
  - label: "SmolLM2 360M Instruct"
    uri: "hf://HuggingFaceTB/SmolLM2-360M-Instruct"
  - label: "Qwen3 0.6B"
    uri: "hf://Qwen/Qwen3-0.6B"
  - label: "Qwen3 1.7B"
    uri: "hf://Qwen/Qwen3-1.7B"
  # --- Larger ungated models (GPU recommended) ---
  - label: "Qwen3 4B"
    uri: "hf://Qwen/Qwen3-4B"
  - label: "Qwen3 8B"
    uri: "hf://Qwen/Qwen3-8B"
  - label: "Qwen3 14B"
    uri: "hf://Qwen/Qwen3-14B"
  - label: "Qwen3 32B"
    uri: "hf://Qwen/Qwen3-32B"
  - label: "Qwen3 30B-A3B (MoE)"
    uri: "hf://Qwen/Qwen3-30B-A3B"
  - label: "Phi-4 Mini Instruct"
    uri: "hf://microsoft/Phi-4-mini-instruct"
  - label: "Phi-4"
    uri: "hf://microsoft/phi-4"
  - label: "Mistral Small 24B Instruct"
    uri: "hf://mistralai/Mistral-Small-24B-Instruct-2501"
  - label: "DeepSeek-R1 Distill Qwen 7B"
    uri: "hf://deepseek-ai/DeepSeek-R1-Distill-Qwen-7B"
  # --- OCI model images (modelcars) from Red Hat's public modelcar catalog ---
  # The kubelet pulls the image once per node and caches it, so restarts and
  # new replicas on that node skip the download. See "OCI model images" in the
  # README for building your own.
  - label: "TinyLlama 1.1B Chat (OCI image)"
    uri: "oci://quay.io/redhat-ai-services/modelcar-catalog:tinyllama-1.1b-chat-v1.0"
  - label: "Granite 3.3 2B Instruct (OCI image)"
    uri: "oci://quay.io/redhat-ai-services/modelcar-catalog:granite-3.3-2b-instruct"
  - label: "Qwen2.5 7B Instruct (OCI image)"
    uri: "oci://quay.io/redhat-ai-services/modelcar-catalog:qwen2.5-7b-instruct"
  # --- Gated models (require a HuggingFace token + access approval) ---
  - label: "Llama 4 Scout 17B-16E Instruct"
    uri: "hf://meta-llama/Llama-4-Scout-17B-16E-Instruct"
    gated: true
  - label: "Gemma 3 4B Instruct"
    uri: "hf://google/gemma-3-4b-it"
    gated: true
  - label: "Gemma 3 12B Instruct"
    uri: "hf://google/gemma-3-12b-it"
    gated: true
  - label: "Gemma 3 27B Instruct"
    uri: "hf://google/gemma-3-27b-it"
    gated: true

# ---------------------------------------------------------------------------
# LoRA adapter catalog (operator-managed).
#
# This list is rendered into the Provider CR (spec.uiSchema.llm.loraCatalog) and
# surfaced in the Adapter 1–3 dropdowns when LoRA deployment is enabled. Edit it
# to add, remove, or reorder adapters — changes take effect on helm upgrade,
# no regeneration needed. Each entry:
#   label: display name shown in the UI
#   name:  served model name in OpenAI requests (must differ from base model)
#   uri:   adapter weights (hf://..., s3://..., pvc://...)
#
# Pair adapters with a compatible base model from the models list above.
loraAdapters:
  # --- Tiny, CPU-friendly ungated adapters (pair with matching base models) ---
  - label: "SmolLM2 135M SFT LoRA (SmolLM2-135M base)"
    name: smollm2-135m-sft
    uri: "hf://Premchan369/smollm2-135m-sft-lora"
  - label: "Qwen2.5 0.5B SFT LoRA (Qwen2.5-0.5B base)"
    name: qwen2.5-0.5b-sft
    uri: "hf://lewtun/Qwen2.5-0.5B-SFT-LoRA"
  - label: "Qwen2.5 0.5B Maestro LoRA (Qwen2.5-0.5B-Instruct base)"
    name: qwen2.5-0.5b-maestro
    uri: "hf://umsa-v1/maestro_Qwen2.5_0.5B_grupo1"

# Models offered in the predictor topology model picker. The first entry is the
# form's default. Each entry:
#   label:       shown in the UI
#   name:        stable key stored on the Instance (parameters.model)
#   modelFormat: KServe model format (selects the serving runtime)
#   storageURI:  model location (hf://, gs://, s3://, ...)
#   task:        optional huggingface runtime task (--task)
#   gpuCount:    optional GPUs per pod; GPU entries are served by vLLM
# Without a GPU the huggingface runtime always mean-pools token embeddings, so
# CPU embedding entries must be mean-pooled models (sentence-transformers'
# 1_Pooling/config.json). CLS- or last-token-pooled models (BGE, Qwen3-Embedding,
# mxbai, Snowflake Arctic) return wrong vectors on CPU; list them with gpuCount.
# -- Models offered in the predictor topology model picker
predictorModels:
  # --- Text embeddings on CPU ---
  - label: "all-MiniLM-L6-v2 (text embeddings, 384-d)"
    name: all-minilm-l6-v2
    modelFormat: huggingface
    storageURI: "hf://sentence-transformers/all-MiniLM-L6-v2"
    task: text_embedding
  - label: "all-mpnet-base-v2 (text embeddings, 768-d)"
    name: all-mpnet-base-v2
    modelFormat: huggingface
    storageURI: "hf://sentence-transformers/all-mpnet-base-v2"
    task: text_embedding
  - label: "Multilingual E5 small (text embeddings, 384-d)"
    name: multilingual-e5-small
    modelFormat: huggingface
    storageURI: "hf://intfloat/multilingual-e5-small"
    task: text_embedding
  - label: "Multilingual E5 base (text embeddings, 768-d)"
    name: multilingual-e5-base
    modelFormat: huggingface
    storageURI: "hf://intfloat/multilingual-e5-base"
    task: text_embedding
  # --- Text embeddings on GPU ---
  - label: "Qwen3 Embedding 0.6B (text embeddings, 1024-d, GPU)"
    name: qwen3-embedding-0.6b
    modelFormat: huggingface
    storageURI: "hf://Qwen/Qwen3-Embedding-0.6B"
    task: text_embedding
    gpuCount: 1
  - label: "Qwen3 Embedding 4B (text embeddings, 2560-d, GPU)"
    name: qwen3-embedding-4b
    modelFormat: huggingface
    storageURI: "hf://Qwen/Qwen3-Embedding-4B"
    task: text_embedding
    gpuCount: 1
  - label: "BGE-M3 (multilingual text embeddings, 1024-d, GPU)"
    name: bge-m3
    modelFormat: huggingface
    storageURI: "hf://BAAI/bge-m3"
    task: text_embedding
    gpuCount: 1
  # --- Text classification ---
  - label: "DistilBERT SST-2 (sentiment classification)"
    name: distilbert-sst2
    modelFormat: huggingface
    storageURI: "hf://distilbert/distilbert-base-uncased-finetuned-sst-2-english"
    task: sequence_classification
  # --- Classic ML (KServe example models) ---
  - label: "scikit-learn Iris (KServe example)"
    name: sklearn-iris
    modelFormat: sklearn
    storageURI: "gs://kfserving-examples/models/sklearn/1.0/model"
  - label: "XGBoost Iris (KServe example)"
    name: xgboost-iris
    modelFormat: xgboost
    storageURI: "gs://kfserving-examples/models/xgboost/1.5/model"
  - label: "LightGBM Iris (KServe example)"
    name: lightgbm-iris
    modelFormat: lightgbm
    storageURI: "gs://kfserving-examples/models/lightgbm/iris"
  - label: "TensorFlow Flowers (image classification, KServe example)"
    name: tensorflow-flowers
    modelFormat: tensorflow
    storageURI: "gs://kfserving-examples/models/tensorflow/flowers"

# ---------------------------------------------------------------------------
# HuggingFace access for gated models.
#
# Gated models (e.g. Llama, Mistral, Gemma) require a HuggingFace token. Create
# a Secret holding the token BEFORE deploying instances, in the same namespace
# as the Instances:
#   kubectl create secret generic hf-token --from-literal=HF_TOKEN=hf_xxx
# Then set `tokenSecretName` to that secret's name. The provider attaches the
# secret to a dedicated ServiceAccount on each llm workload, and on predictor
# Instances with an hf:// storageURI, so KServe's
# storage-initializer authenticates the download. The secret MUST contain an
# `HF_TOKEN` key. Leave empty to disable (only ungated models will download).
huggingface:
  # -- Name of the pre-created Secret (with an HF_TOKEN key) for gated downloads
  tokenSecretName: ""

# KServe's storage-initializer is the init container that downloads hf:// and
# s3:// models into every llm model pod. KServe caps it at 1 CPU / 1Gi memory,
# which is OOM-killed on multi-GB downloads (already at 1.2 GB). Applies to all
# llm Instances and, merged over its defaults, to the bundled `default`
# ClusterStorageContainer that downloads predictor models.
storageInitializer:
  # -- Resources for the storage-initializer. Empty keeps KServe's defaults.
  resources:
    limits:
      memory: 4Gi

# Prometheus Operator metrics scraping. The provider ships no monitoring stack;
# it only makes model workloads discoverable by an existing Prometheus Operator.
metrics:
  podMonitor:
    # -- Emit a PodMonitor per Instance so an existing Prometheus Operator
    # scrapes the model /metrics endpoint. Safe to leave on: if the
    # monitoring.coreos.com CRDs are absent the provider skips it instead of
    # erroring. To actually collect metrics, a Prometheus must select this
    # PodMonitor (podMonitorSelector/namespaceSelector matching the Instance
    # namespace). See docs/observability.md.
    enabled: true
    # -- Scrape interval for the generated PodMonitor
    interval: 30s
  grafanaDashboards:
    # -- Create ConfigMaps labeled for kube-prometheus-stack's Grafana dashboard
    # sidecar (grafana-sc-dashboard). Off by default: Grafana namespace and
    # sidecar label conventions vary by platform. Enable when your cluster runs
    # kube-prometheus-stack (or equivalent) and the sidecar watches
    # metrics.grafanaDashboards.namespace. See docs/observability.md.
    enabled: false
    # -- Namespace where Grafana runs (ConfigMaps are created here, not in the
    # provider release namespace).
    namespace: monitoring
    # -- Label key/value the Grafana dashboard sidecar watches (kube-prom default).
    label: grafana_dashboard
    labelValue: "1"
    # -- Also provision docs/dashboards/gateway.json when aiGateway.enabled.
    gateway: true
    # -- Extra labels on dashboard ConfigMaps (optional).
    extraLabels: {}

# -- Additional environment variables to set on the provider container
extraEnv: []
# - name: MY_VAR
#   value: "my-value"

# -- Additional volume mounts to add to the provider container
extraVolumeMounts: []

# -- Additional volumes to add to the pod
extraVolumes: []

# -- Leader election configuration
leaderElection:
  # -- Enable leader election (recommended for HA deployments)
  enabled: true

# ---------------------------------------------------------------------------
# Bundled KServe controllers and cert-manager (subchart dependencies).
#
# The provider translates Instances into KServe custom resources but does not
# reconcile them. These bundled controllers do. Toggle any of them off to
# manage that piece out of band. See Chart.yaml for the dependency wiring.
#
# The KServe CRDs are not packaged in this chart; the kserveCRDs hook Job
# fetches them at install time (see README).
# ---------------------------------------------------------------------------

# KServe CRDs fetched over the network at install time. When enabled, a
# pre-install/pre-upgrade hook Job renders KServe's CRD charts from the registry
# and server-side applies them, so they exist before the controllers start and
# are upgraded with every `helm upgrade`. Set install=false when the KServe CRDs
# are managed elsewhere (for example as KServe's own Helm releases).
kserveCRDs:
  # -- Install/upgrade the KServe CRDs from the registry in a hook Job
  install: true
  # -- OCI registry holding KServe's CRD charts (override for mirrors)
  registry: oci://ghcr.io/kserve/charts
  # -- CRD charts to apply
  charts:
    - kserve-crd
    - kserve-llmisvc-crd
  # -- CRD chart version; empty uses the bundled kserve-resources chart version
  version: ""

# -- Image (with helm and kubectl) for the kserveCRDs and kserve-objects hook Jobs
hookImage: alpine/k8s:1.36.0

# -- cert-manager provides the webhook certificates the KServe controllers
# require, so it must be present. Off by default: most clusters already run it,
# and installing it in the same release races its CRDs and webhook against the
# KServe `Issuer` / `Certificate`. Install it first (see README).
cert-manager:
  # -- Install cert-manager as part of this release
  enabled: false
  # -- Install the cert-manager CRDs (required unless already present)
  crds:
    enabled: true

# -- KServe InferenceService controller (predictor topology). Reconciles the
# `InferenceService` resources the provider creates. This controller owns the
# shared KServe resources (the `inferenceservice-config` ConfigMap, the
# self-signed webhook Issuer, and the ClusterStorageContainer).
kserveResources:
  # -- Deploy the KServe InferenceService controller
  enabled: true
  kserve:
    # -- KServe image tag; keep in step with the chart versions in Chart.yaml
    version: v0.21.0
    # The ClusterStorageContainer is applied by the kserve-objects hook Job;
    # the ConfigMap and webhook Issuer stay in the release.
    createSharedResources: false
    inferenceServiceConfig:
      enabled: true
    certManager:
      enabled: true
    controller:
      # -- Cluster-wide default deployment mode. Standard (formerly named
      # "RawDeployment") yields plain Kubernetes Deployments + HPA and avoids
      # the Knative/Istio dependency. The provider also annotates every
      # InferenceService for Standard.
      deploymentMode: Standard

# -- KServe LLMInferenceService controller (llm topology). Reconciles the
# `LLMInferenceService` resources the provider creates for vLLM serving.
kserveLlmisvcResources:
  # -- Deploy the KServe LLMInferenceService controller
  enabled: true
  kserve:
    version: v0.21.0
    # -- Shared resources are created by kserveResources to avoid duplicate
    # resource conflicts within a single Helm release. If you disable
    # kserveResources but keep this controller, set this to `true` so the
    # shared ConfigMap and self-signed Issuer are created here instead.
    createSharedResources: false
    controller:
      deploymentMode: Standard

# -- KServe's ClusterServingRuntimes, which the InferenceService controller
# selects from by model format (needed by the predictor topology). Vendored from
# the kserve-runtime-configs chart by `make sync-kserve-objects` and applied by
# the kserve-objects hook Job once the KServe webhooks serve.
kserveRuntimeConfigs:
  # -- Apply the KServe ClusterServingRuntimes
  enabled: true

# -- LLMInferenceServiceConfig presets required by the llm topology (without
# them it stalls with `ConfigNotFound: kserve-config-llm-template`). These are
# vendored from KServe under this chart's `files/llmisvcconfigs/` directory (see
# `make sync-kserve-objects`) and applied into the release namespace by the
# kserve-objects hook Job, replacing the upstream copies that are hardcoded to
# the `kserve` namespace. This is what lets the provider run in any namespace.
# Disable if you manage the presets out of band.
llmPresets:
  # -- Render the LLMInferenceServiceConfig presets into the release namespace
  enabled: true

# -- CPU compute profile. Renders an extra `kserve-config-llm-cpu`
# `LLMInferenceServiceConfig` into the release namespace that overrides the
# default (CUDA/GPU) `main` container image with a CPU-only vLLM build. The llm
# topology composes it via `baseRefs` when a user selects the "CPU" compute
# profile in the UI. Requires `llmPresets.enabled` (it layers onto those
# presets). Disable if you do not need CPU serving.
cpuProfile:
  # -- Render the CPU `LLMInferenceServiceConfig`
  enabled: true
  # -- CPU-capable vLLM image used by the CPU profile. The bundled GPU presets
  # use a CUDA image that cannot run on CPU nodes, so this must be a CPU build.
  image: vllm/vllm-openai-cpu:v0.31.0
  # -- Default vLLM args applied to the CPU profile's model-server container.
  # These keep vLLM CPU within a modest node: cap the startup memory reservation
  # (--gpu-memory-utilization, which governs CPU memory despite its name), skip
  # torch.compile (--enforce-eager), and shrink the KV arena (--max-model-len).
  # They are the *defaults*; a per-instance Advanced (inline
  # LLMInferenceServiceConfig) `args` on the `main` container replaces this whole
  # list, so users can override any of them. Engine Tuning fields
  # (llmEngine.parameters.engine) are appended after the list and win over the
  # same flags. Set to [] to apply no defaults.
  defaultArgs:
    - --gpu-memory-utilization=0.3
    - --enforce-eager
    - --max-model-len=2048
  # NOTE: CPU/memory are NOT set here. They are tuned per instance in the llm
  # topology's Runtime section (spec.components.llmEngine.resources) and applied
  # to the model server container, so sizing is finetuned per instance rather
  # than shared across all CPU instances.

# ---------------------------------------------------------------------------
# Optional Envoy AI Gateway.
#
# `aiGateway.enabled` creates one shared Gateway and turns on the feature in
# the provider. It does not install controllers: either set
# `envoy-gateway.enabled` / `envoy-ai-gateway.enabled` below, or bring your own
# Envoy Gateway (v1.9+, with the extension-manager config below) and Envoy AI
# Gateway. Individual llm Instances opt in with
# `spec.topology.parameters.externalAccess: EnvoyAIGateway`.
# TLS is chart-level (`aiGateway.tls`), not an Instance form field.
aiGateway:
  # -- Create the shared Gateway and enable the AI Gateway access path
  enabled: false
  # -- Scheme published in Instance connection details
  scheme: http
  listener:
    # -- Gateway listener protocol
    protocol: HTTP
    # -- Gateway listener and public connection port
    port: 80
  tls:
    # -- Issue a public certificate and expose the Gateway over HTTPS on port 443
    enabled: false
    # -- DNS name clients use for the Gateway, for example llm.example.com
    hostname: ""
    # -- Secret populated by cert-manager (also the Certificate name); empty uses <gateway-name>-tls
    secretName: ""
    # -- Add a port-80 listener that only serves cert-manager HTTP-01
    # challenges (Gateway API solver). Model traffic stays on HTTPS.
    acmeHTTP01: false
    # -- Existing cert-manager Issuer or ClusterIssuer. cert-manager must run
    # with Gateway API support (`config.enableGatewayAPI: true`); it creates
    # the Certificate from the Gateway's annotations.
    issuerRef:
      name: ""
      kind: ClusterIssuer
      group: cert-manager.io
  gatewayService:
    # -- Envoy proxy Service type (LoadBalancer, NodePort, or ClusterIP)
    type: LoadBalancer
  # -- Largest request or response body the Gateway buffers. The AI Gateway
  # reads whole bodies (model name, token usage), so this caps prompt and
  # completion size and embedding batch size.
  bufferLimit: 50Mi
  auth:
    # -- Require an API key on every request through the shared Gateway. Each
    # llm Instance gets a generated key in its connection details (password).
    enabled: true
    # -- Allow API keys over a plain HTTP listener (local development only)
    allowInsecureHTTP: false

# Envoy Gateway subchart. Off by default: a second Envoy Gateway with the same
# controllerName would fight an existing one over every Gateway. When you bring
# your own, apply the same `config.envoyGateway` (extension manager) to it.
envoy-gateway:
  # -- Install Envoy Gateway into the release namespace
  enabled: false
  config:
    envoyGateway:
      gateway:
        controllerName: gateway.envoyproxy.io/gatewayclass-controller
      extensionApis:
        enableEnvoyPatchPolicy: true
        enableBackend: true
      extensionManager:
        backendResources:
          - group: inference.networking.k8s.io
            kind: InferencePool
            version: v1
        hooks:
          xdsTranslator:
            translation:
              listener:
                includeAll: true
              route:
                includeAll: true
              cluster:
                includeAll: true
              secret:
                includeAll: true
            post:
              - Translation
              - Cluster
              - Route
        service:
          fqdn:
            hostname: ai-gateway-controller
            port: 1063
      # To enable per-key token quotas, add an existing Redis/Valkey endpoint
      # (or redis.urlRef.secretKeyRef). A password-protected backend also needs
      # REDIS_AUTH on the rate limit deployment; see the README.
      # rateLimit:
      #   backend:
      #     type: Redis
      #     redis:
      #       url: valkey.default.svc.cluster.local:6379

# Envoy AI Gateway controller and CRDs. Off by default; enable together with
# `envoy-gateway.enabled` (the extension-manager hostname above assumes both
# run in the release namespace).
envoy-ai-gateway:
  # -- Install the Envoy AI Gateway controller and CRDs into the release namespace
  enabled: false
  controller:
    # Labels GenAI metrics with the authenticated API key ID.
    metricsRequestHeaderAttributes: "x-openeverest-key-id:openeverest.key.id"

envoy-ai-gateway-crds: {}

# LeaderWorkerSet controller, required for multi-node llm Instances
# (workerCount + pipelineParallelSize). Off by default: its webhook
# configurations are cluster-scoped, so it cannot sit next to an existing LWS.
# Its CRD is installed only by `helm install`; apply it first if you enable this
# with `helm upgrade`.
lws:
  # -- Install the LeaderWorkerSet controller and CRD into the release namespace
  enabled: false

