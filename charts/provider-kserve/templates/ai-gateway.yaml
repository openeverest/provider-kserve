{{- if .Values.aiGateway.enabled }}
{{- if and .Values.aiGateway.auth.enabled (not .Values.aiGateway.tls.enabled) (not .Values.aiGateway.auth.allowInsecureHTTP) }}
{{- fail "aiGateway.auth requires HTTPS: set aiGateway.tls.enabled=true (or aiGateway.auth.allowInsecureHTTP=true for local development)" }}
{{- end }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ include "provider-kserve.aiGatewayName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "provider-kserve.labels" . | nindent 4 }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: {{ .Values.aiGateway.gatewayService.type }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ include "provider-kserve.aiGatewayClassName" . }}
  labels:
    {{- include "provider-kserve.labels" . | nindent 4 }}
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "provider-kserve.aiGatewayName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "provider-kserve.labels" . | nindent 4 }}
  {{- if .Values.aiGateway.tls.enabled }}
  # cert-manager creates the Certificate, so the chart needs no cert-manager CRDs at install.
  {{- with .Values.aiGateway.tls.issuerRef }}
  {{- $issuerName := required "aiGateway.tls.issuerRef.name is required when AI Gateway TLS is enabled" .name }}
  {{- $issuerKind := default "ClusterIssuer" .kind }}
  {{- $issuerGroup := default "cert-manager.io" .group }}
  annotations:
    {{- if and (eq $issuerKind "ClusterIssuer") (eq $issuerGroup "cert-manager.io") }}
    cert-manager.io/cluster-issuer: {{ $issuerName | quote }}
    {{- else }}
    cert-manager.io/issuer: {{ $issuerName | quote }}
    cert-manager.io/issuer-kind: {{ $issuerKind | quote }}
    cert-manager.io/issuer-group: {{ $issuerGroup | quote }}
    {{- end }}
  {{- end }}
  {{- end }}
spec:
  gatewayClassName: {{ include "provider-kserve.aiGatewayClassName" . }}
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: {{ include "provider-kserve.aiGatewayName" . }}
  listeners:
    {{- if .Values.aiGateway.tls.enabled }}
    - name: {{ include "provider-kserve.aiGatewayListenerName" . }}
      hostname: {{ required "aiGateway.tls.hostname is required when AI Gateway TLS is enabled" .Values.aiGateway.tls.hostname | quote }}
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ include "provider-kserve.aiGatewayTLSSecretName" . }}
      allowedRoutes:
        namespaces:
          from: All
    {{- if .Values.aiGateway.tls.acmeHTTP01 }}
    # Serves only cert-manager HTTP-01 challenges (created in this namespace).
    # Model routes and API keys are bound to the HTTPS listener above.
    - name: acme-http01
      hostname: {{ .Values.aiGateway.tls.hostname | quote }}
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
    {{- else }}
    - name: {{ include "provider-kserve.aiGatewayListenerName" . }}
      protocol: {{ .Values.aiGateway.listener.protocol }}
      port: {{ .Values.aiGateway.listener.port }}
      allowedRoutes:
        namespaces:
          from: All
    {{- end }}
{{- if .Values.aiGateway.auth.enabled }}
---
# The provider renders the API key SecurityPolicy (<gateway>-api-keys). This
# drops any client-supplied key ID header before authentication sets it.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ include "provider-kserve.aiGatewayName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "provider-kserve.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ include "provider-kserve.aiGatewayName" . }}
  headers:
    earlyRequestHeaders:
      remove:
        - x-openeverest-key-id
{{- end }}
{{- if (index .Values "envoy-gateway").enabled }}
---
# The upstream AI Gateway chart grants InferencePool reads to the Envoy Gateway
# service account in envoy-gateway-system; the bundled one runs in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "provider-kserve.aiGatewayPoolReaderName" . }}
  labels:
    {{- include "provider-kserve.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - inference.networking.k8s.io
    resources:
      - inferencepools
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "provider-kserve.aiGatewayPoolReaderName" . }}
  labels:
    {{- include "provider-kserve.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "provider-kserve.aiGatewayPoolReaderName" . }}
subjects:
  - kind: ServiceAccount
    name: envoy-gateway
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
