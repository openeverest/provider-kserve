{{- if and .Values.aiGateway.enabled .Values.aiGateway.auth.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ printf "%s-apikey" (include "provider-kserve.aiGatewayName" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "provider-kserve.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ include "provider-kserve.aiGatewayName" . }}
  apiKeyAuth:
    credentialRefs:
      - group: ""
        kind: Secret
        name: {{ required "aiGateway.auth.existingSecretName is required when AI Gateway auth is enabled" .Values.aiGateway.auth.existingSecretName | quote }}
    extractFrom:
      - headers:
          - x-api-key
{{- end }}
