{{- if .Values.kserveCRDs.install }}
{{- $version := .Values.kserveCRDs.version }}
{{- if not $version }}
{{- range .Chart.Dependencies }}
{{- /* Helm rewrites a dependency's Name to its alias and drops disabled ones; all KServe subcharts share one version. */}}
{{- if and (not $version) (has .Name (list "kserveResources" "kserveLlmisvcResources" "kserveRuntimeConfigs")) }}{{- $version = .Version }}{{- end }}
{{- end }}
{{- end }}
{{- if not $version }}{{ fail "kserveCRDs: set kserveCRDs.version (no KServe subchart enabled)" }}{{- end }}
{{- $name := printf "%s-kserve-crds" (include "provider-kserve.fullname" .) | trunc 63 | trimSuffix "-" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "provider-kserve.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "provider-kserve.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "provider-kserve.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "provider-kserve.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  # Fail the install instead of hanging when the registry is unreachable.
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        helm.sh/chart: {{ include "provider-kserve.chart" . }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/component: kserve-crds
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kserve-crds
          image: {{ .Values.kserveCRDs.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: HOME
              value: /tmp
            - name: REGISTRY
              value: {{ .Values.kserveCRDs.registry | quote }}
            - name: VERSION
              value: {{ $version | quote }}
          command:
            - /bin/sh
            - -ec
            - |
              applied=""
              for chart in {{ join " " .Values.kserveCRDs.charts }}; do
                echo "Applying ${REGISTRY}/${chart}:${VERSION}"
                applied="${applied} $(helm template "${chart}" "${REGISTRY}/${chart}" --version "${VERSION}" \
                  | kubectl apply --server-side --force-conflicts --field-manager=provider-kserve-crds -o name -f -)"
              done
              kubectl wait --for=condition=Established --timeout=120s ${applied}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
