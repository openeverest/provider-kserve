{{- /* KServe v0.20 has no strategy field; mutating its dry-run updates too keeps it from reverting this. */}}
{{- if and .Values.gpuRecreateRollout.enabled (.Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1/MutatingAdmissionPolicy") }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: {{ include "provider-kserve.fullname" . }}-gpu-recreate
  labels:
    {{- include "provider-kserve.labels" . | nindent 4 }}
spec:
  failurePolicy: Ignore
  reinvocationPolicy: Never
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
    objectSelector:
      matchLabels:
        app.kubernetes.io/part-of: llminferenceservice
  matchConditions:
    - name: requests-gpu
      expression: >-
        object.spec.template.spec.containers.exists(c,
        has(c.resources) && has(c.resources.limits) &&
        c.resources.limits.exists(k, k.endsWith('/gpu')))
    - name: not-recreate
      expression: >-
        !has(object.spec.strategy) || !has(object.spec.strategy.type) ||
        object.spec.strategy.type != 'Recreate'
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          [JSONPatch{op: "add", path: "/spec/strategy", value: Object.spec.strategy{type: "Recreate"}}]
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: {{ include "provider-kserve.fullname" . }}-gpu-recreate
  labels:
    {{- include "provider-kserve.labels" . | nindent 4 }}
spec:
  policyName: {{ include "provider-kserve.fullname" . }}-gpu-recreate
{{- end }}
