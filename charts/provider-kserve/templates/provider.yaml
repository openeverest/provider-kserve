apiVersion: core.openeverest.io/v1alpha1
kind: Provider
metadata:
  name: {{ .Values.provider.name }}
  labels:
    {{- include "provider-kserve.labels" . | nindent 4 }}
# The base spec is generated by `provider-sdk generate` from definition/ files
# (run `make generate` to update). The model catalog is merged in here from
# `.Values.models` so operators can customize the llm model picker without
# regenerating the schema. It is injected under spec.uiSchema.llm.modelCatalog:
# spec.uiSchema is the only PreserveUnknownFields region in the Provider CRD, so
# a top-level spec.modelCatalog field would be pruned by the apiserver as an
# unknown field. It is nested inside the `llm` topology node (rather than a
# top-level uiSchema key) so it is not enumerated as a selectable topology in
# the UI's topology dropdown. The llm topology's modelURI select reads options
# from spec.uiSchema.llm.modelCatalog via optionsPath.
{{- $doc := .Files.Get "generated/provider-spec.yaml" | fromYaml }}
{{- $spec := $doc.spec }}
{{- $catalog := list }}
{{- range .Values.models }}
{{- $label := ternary (printf "%s (gated)" .label) .label (default false .gated) }}
{{- $catalog = append $catalog (dict "label" $label "uri" .uri) }}
{{- end }}
{{- $loraCatalog := list }}
{{- range .Values.loraAdapters }}
{{- $loraCatalog = append $loraCatalog (dict "label" .label "name" .name "uri" .uri) }}
{{- end }}
{{- $uiSchema := default (dict) $spec.uiSchema }}
{{- $llm := default (dict) (index $uiSchema "llm") }}
{{- $_ := set $llm "modelCatalog" $catalog }}
{{- $_ := set $llm "loraCatalog" $loraCatalog }}
{{- $_ := set $uiSchema "llm" $llm }}
{{- $_ := set $spec "uiSchema" $uiSchema }}
spec:
  {{- $spec | toYaml | nindent 2 }}
