apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "provider-kserve.fullname" . }}
  labels:
    {{- include "provider-kserve.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "provider-kserve.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "provider-kserve.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "provider-kserve.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: provider
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "provider-kserve.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            # Secret (with an HF_TOKEN key) the provider attaches to llm
            # workloads so KServe can download gated HuggingFace models.
            - name: HF_TOKEN_SECRET_NAME
              value: {{ .Values.huggingface.tokenSecretName | quote }}
            - name: AI_GATEWAY_NAME
              value: {{ include "provider-kserve.aiGatewayName" . | quote }}
            - name: AI_GATEWAY_ENABLED
              value: {{ .Values.aiGateway.enabled | quote }}
            - name: AI_GATEWAY_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AI_GATEWAY_SCHEME
              value: {{ include "provider-kserve.aiGatewayScheme" . | quote }}
            - name: AI_GATEWAY_PORT
              value: {{ include "provider-kserve.aiGatewayPort" . | quote }}
            - name: AI_GATEWAY_HOSTNAME
              value: {{ ternary .Values.aiGateway.tls.hostname "" .Values.aiGateway.tls.enabled | quote }}
            - name: AI_GATEWAY_RATE_LIMIT_REDIS_URL
              value: {{ dig "rateLimit" "backend" "redis" "url" "" (index .Values "envoy-gateway").config.envoyGateway | quote }}
            - name: ENABLE_POD_MONITOR
              value: {{ .Values.metrics.podMonitor.enabled | quote }}
            - name: POD_MONITOR_INTERVAL
              value: {{ .Values.metrics.podMonitor.interval | quote }}
            - name: LORA_ADAPTER_CATALOG
              value: {{ .Values.loraAdapters | toJson | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
