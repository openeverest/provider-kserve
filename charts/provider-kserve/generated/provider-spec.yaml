                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                          optional:
                            description: Specify whether the Secret or its key must be defined
                            type: boolean
                        required:
                          - key
                        type: object
                        x-kubernetes-map-type: atomic
                    type: object
                required:
                  - name
                type: object
              type: array
            gpuCount:
              description: |-
                GpuCount is the number of GPUs (nvidia.com/gpu) each predictor pod
                requests. Unset takes the catalog entry's value; 0 runs on CPU.
              format: int32
              type: integer
            healthPath:
              description: |-
                HealthPath is an HTTP path on port that returns 200 once the model is
                loaded (e.g. /health); the pod gets no traffic before that. Requires
                image.
              type: string
            image:
              description: |-
                Image serves the model with this container image instead of a KServe
                serving runtime; model, modelFormat, runtime, runtimeVersion and task
                do not apply. Args, env, gpuCount and the component resources apply to
                this container, and storageURI (optional) is downloaded to /mnt/models.
              type: string
            imagePullSecret:
              description: |-
                ImagePullSecret names a Secret for pulling image from a private
                registry. Requires image.
              type: string
            labels:
              additionalProperties:
                type: string
              description: |-
                Labels are added to the InferenceService; KServe copies them to the
                predictor pods. Keys the provider manages are rejected.
              type: object
            maxReplicas:
              description: MaxReplicas is the autoscaling ceiling.
              format: int32
              type: integer
            minReplicas:
              description: |-
                MinReplicas is the autoscaling floor, at least 1: KServe Standard mode
                does not scale to zero.
              format: int32
              type: integer
            model:
              description: |-
                Model names an entry of the chart's predictorModels catalog (the UI model
                picker). It supplies modelFormat, storageURI and task unless modelFormat
                or storageURI is set, in which case the catalog entry is ignored.
              type: string
            modelFormat:
              description: |-
                ModelFormat is the model framework, e.g. "sklearn", "pytorch",
                "tensorflow", "xgboost", "onnx", "triton", "huggingface". KServe uses it
                to auto-select a supporting ServingRuntime.
              type: string
            openAICompatible:
              description: |-
                OpenAICompatible marks an image that serves the OpenAI API under /v1,
                which makes it eligible for the Envoy AI Gateway. Shorthand for
                apiSchema OpenAI. Requires image.
              type: boolean
            port:
              description: |-
                Port is the HTTP port the image listens on (default 8080). Requires
                image.
              format: int32
              type: integer
            runtime:
              description: |-
                Runtime explicitly selects a (Cluster)ServingRuntime by name instead of
                letting KServe auto-select one from the model format.
              type: string
            runtimeVersion:
              description: |-
                RuntimeVersion pins the serving runtime version. Optional; KServe defaults
                based on the selected runtime when empty.
              type: string
            securityContext:
              description: SecurityContext is the predictor pod's security context.
              properties:
                appArmorProfile:
                  description: |-
                    appArmorProfile is the AppArmor options to use by the containers in this pod.
                    Note that this field cannot be set when spec.os.name is windows.
                  properties:
                    localhostProfile:
                      description: |-
                        localhostProfile indicates a profile loaded on the node that should be used.
                        The profile must be preconfigured on the node to work.
                        Must match the loaded name of the profile.
                        Must be set if and only if type is "Localhost".
                      type: string
                    type:
                      description: |-
                        type indicates which kind of AppArmor profile will be applied.
                        Valid options are:
                          Localhost - a profile pre-loaded on the node.
                          RuntimeDefault - the container runtime's default profile.
                          Unconfined - no AppArmor enforcement.
                      type: string
                  required:
                    - type
                  type: object
                fsGroup:
                  description: |-
                    A special supplemental group that applies to all containers in a pod.
                    Some volume types allow the Kubelet to change the ownership of that volume
                    to be owned by the pod:

                    1. The owning GID will be the FSGroup
                    2. The setgid bit is set (new files created in the volume will be owned by FSGroup)
                    3. The permission bits are OR'd with rw-rw----

                    If unset, the Kubelet will not modify the ownership and permissions of any volume.
                    Note that this field cannot be set when spec.os.name is windows.
                  format: int64
                  type: integer
                fsGroupChangePolicy:
                  description: |-
                    fsGroupChangePolicy defines behavior of changing ownership and permission of the volume
                    before being exposed inside Pod. This field will only apply to
                    volume types which support fsGroup based ownership(and permissions).
                    It will have no effect on ephemeral volume types such as: secret, configmaps
                    and emptydir.
                    Valid values are "OnRootMismatch" and "Always". If not specified, "Always" is used.
                    Note that this field cannot be set when spec.os.name is windows.
                  type: string
                runAsGroup:
                  description: |-
                    The GID to run the entrypoint of the container process.
                    Uses runtime default if unset.
                    May also be set in SecurityContext.  If set in both SecurityContext and
                    PodSecurityContext, the value specified in SecurityContext takes precedence
                    for that container.
                    Note that this field cannot be set when spec.os.name is windows.
                  format: int64
                  type: integer
                runAsNonRoot:
                  description: |-
                    Indicates that the container must run as a non-root user.
                    If true, the Kubelet will validate the image at runtime to ensure that it
                    does not run as UID 0 (root) and fail to start the container if it does.
                    If unset or false, no such validation will be performed.
                    May also be set in SecurityContext.  If set in both SecurityContext and
                    PodSecurityContext, the value specified in SecurityContext takes precedence.
                  type: boolean
                runAsUser:
                  description: |-
                    The UID to run the entrypoint of the container process.
                    Defaults to user specified in image metadata if unspecified.
                    May also be set in SecurityContext.  If set in both SecurityContext and
                    PodSecurityContext, the value specified in SecurityContext takes precedence
                    for that container.
                    Note that this field cannot be set when spec.os.name is windows.
                  format: int64
                  type: integer
                seLinuxChangePolicy:
                  description: |-
                    seLinuxChangePolicy defines how the container's SELinux label is applied to all volumes used by the Pod.
                    It has no effect on nodes that do not support SELinux or to volumes does not support SELinux.
                    Valid values are "MountOption" and "Recursive".

                    "Recursive" means relabeling of all files on all Pod volumes by the container runtime.
                    This may be slow for large volumes, but allows mixing privileged and unprivileged Pods sharing the same volume on the same node.

                    "MountOption" mounts all eligible Pod volumes with `-o context` mount option.
                    This requires all Pods that share the same volume to use the same SELinux label.
                    It is not possible to share the same volume among privileged and unprivileged Pods.
                    Eligible volumes are in-tree FibreChannel and iSCSI volumes, and all CSI volumes
                    whose CSI driver announces SELinux support by setting spec.seLinuxMount: true in their
                    CSIDriver instance. Other volumes are always re-labelled recursively.

                    If not specified, "MountOption" is used.

                    This field affects only Pods that have SELinux label set, either in PodSecurityContext or in SecurityContext of all containers.

                    All Pods that use the same volume should use the same seLinuxChangePolicy, otherwise some pods can get stuck in ContainerCreating state.
                    Note that this field cannot be set when spec.os.name is windows.
                  type: string
                seLinuxOptions:
                  description: |-
                    The SELinux context to be applied to all containers.
                    If unspecified, the container runtime will allocate a random SELinux context for each
                    container.  May also be set in SecurityContext.  If set in
                    both SecurityContext and PodSecurityContext, the value specified in SecurityContext
                    takes precedence for that container.
                    Note that this field cannot be set when spec.os.name is windows.
                  properties:
                    level:
                      description: Level is SELinux level label that applies to the container.
                      type: string
                    role:
                      description: Role is a SELinux role label that applies to the container.
                      type: string
                    type:
                      description: Type is a SELinux type label that applies to the container.
                      type: string
                    user:
                      description: User is a SELinux user label that applies to the container.
                      type: string
                  type: object
                seccompProfile:
                  description: |-
                    The seccomp options to use by the containers in this pod.
                    Note that this field cannot be set when spec.os.name is windows.
                  properties:
                    localhostProfile:
                      description: |-
                        localhostProfile indicates a profile defined in a file on the node should be used.
                        The profile must be preconfigured on the node to work.
                        Must be a descending path, relative to the kubelet's configured seccomp profile location.
                        Must be set if type is "Localhost". Must NOT be set for any other type.
                      type: string
                    type:
                      description: |-
                        type indicates which kind of seccomp profile will be applied.
                        Valid options are:

                        Localhost - a profile defined in a file on the node should be used.
                        RuntimeDefault - the container runtime default profile should be used.
                        Unconfined - no profile should be applied.
                      type: string
                  required:
                    - type
                  type: object
                supplementalGroups:
                  description: |-
                    A list of groups applied to the first process run in each container, in
                    addition to the container's primary GID and fsGroup (if specified).  If
                    the SupplementalGroupsPolicy feature is enabled, the
                    supplementalGroupsPolicy field determines whether these are in addition
                    to or instead of any group memberships defined in the container image.
                    If unspecified, no additional groups are added, though group memberships
                    defined in the container image may still be used, depending on the
                    supplementalGroupsPolicy field.
                    Note that this field cannot be set when spec.os.name is windows.
                  items:
                    format: int64
                    type: integer
                  type: array
                  x-kubernetes-list-type: atomic
                supplementalGroupsPolicy:
                  description: |-
                    Defines how supplemental groups of the first container processes are calculated.
                    Valid values are "Merge" and "Strict". If not specified, "Merge" is used.
                    (Alpha) Using the field requires the SupplementalGroupsPolicy feature gate to be enabled
                    and the container runtime must implement support for this feature.
                    Note that this field cannot be set when spec.os.name is windows.
                  type: string
                sysctls:
                  description: |-
                    Sysctls hold a list of namespaced sysctls used for the pod. Pods with unsupported
                    sysctls (by the container runtime) might fail to launch.
                    Note that this field cannot be set when spec.os.name is windows.
                  items:
                    description: Sysctl defines a kernel parameter to be set
                    properties:
                      name:
                        description: Name of a property to set
                        type: string
                      value:
                        description: Value of a property to set
                        type: string
                    required:
                      - name
                      - value
                    type: object
                  type: array
                  x-kubernetes-list-type: atomic
                windowsOptions:
                  description: |-
                    The Windows specific settings applied to all containers.
                    If unspecified, the options within a container's SecurityContext will be used.
                    If set in both SecurityContext and PodSecurityContext, the value specified in SecurityContext takes precedence.
                    Note that this field cannot be set when spec.os.name is linux.
                  properties:
                    gmsaCredentialSpec:
                      description: |-
                        GMSACredentialSpec is where the GMSA admission webhook
                        (https://github.com/kubernetes-sigs/windows-gmsa) inlines the contents of the
                        GMSA credential spec named by the GMSACredentialSpecName field.
                      type: string
                    gmsaCredentialSpecName:
                      description: GMSACredentialSpecName is the name of the GMSA credential spec to use.
                      type: string
                    hostProcess:
                      description: |-
                        HostProcess determines if a container should be run as a 'Host Process' container.
                        All of a Pod's containers must have the same effective HostProcess value
                        (it is not allowed to have a mix of HostProcess containers and non-HostProcess containers).
                        In addition, if HostProcess is true then HostNetwork must also be set to true.
                      type: boolean
                    runAsUserName:
                      description: |-
                        The UserName in Windows to run the entrypoint of the container process.
                        Defaults to the user specified in image metadata if unspecified.
                        May also be set in PodSecurityContext. If set in both SecurityContext and
                        PodSecurityContext, the value specified in SecurityContext takes precedence.
                      type: string
                  type: object
              type: object
            servedModelName:
              description: |-
                ServedModelName is the model name the image expects in requests. The
                connection details report it, and the AI Gateway rewrites the Instance
                name to it. Requires image.
              type: string
            serviceAccountName:
              description: |-
                ServiceAccountName is the ServiceAccount the predictor pods run as (e.g.
                one bound to cloud IAM for model downloads). Empty uses the namespace
                default.
              type: string
            storageContainer:
              description: |-
                StorageContainer names a ClusterStorageContainer. When set, KServe uses
                that initializer instead of matching on the storage URI scheme
                (spec.predictor.storageContainerName), e.g. one with a larger memory limit
                for big models. It must exist, be enabled, and support StorageURI.
              type: string
            storageURI:
              description: |-
                StorageURI is the location of the model artifacts (s3://, gs://, hf://,
                pvc://, oci:// or a local path).
              type: string
            task:
              description: |-
                Task selects the huggingface runtime task (--task), e.g. text_embedding
                or sequence_classification. Empty lets the runtime infer it from the
                model config. Only valid with modelFormat huggingface; a --task in Args
                wins.
              type: string
          type: object
      type: modelServer
  defaultVersion: "0.21"
  release:
    version: 0.1.0
  topologies:
    llm:
      components:
        llmEngine: {}
      parametersSchema:
        openAPIV3Schema:
          description: |-
            LlmTopologyParameters defines the topology-level parameters for the llm
            topology. Component-level parameters (model URI, parallelism, etc.) live on
            the llmEngine component; these are cross-cutting deployment options that
            shape the generated LLMInferenceService.
          properties:
            enableAIGateway:
              description: |-
                EnableAIGateway exposes the model through the shared Envoy AI Gateway.
                Legacy alias for ExternalAccess=EnvoyAIGateway when ExternalAccess is unset.
              type: boolean
            enableGatewayRouting:
              description: |-
                EnableGatewayRouting provisions a managed Gateway API route plus an
                Inference Gateway scheduler (Endpoint Picker) for prefix-cache aware
                routing across replicas. When false, the LLMInferenceService is exposed
                with its default networking. Envoy AI Gateway implies gateway routing.
              type: boolean
            enableMetrics:
              description: |-
                EnableMetrics emits a Prometheus Operator PodMonitor for this instance's
                vLLM pods (/metrics). Nil/unset defaults to true for backward compatibility.
              type: boolean
            enablePrefill:
              description: |-
                EnablePrefill turns on disaggregated serving by creating a separate
                prefill deployment in addition to the decode workload (llm-d pattern).
              type: boolean
            enableTracing:
              description: |-
                EnableTracing turns on KServe's built-in distributed tracing (OTLP) across
                the gateway, scheduler and model components. Disabled by default. When
                enabled without an endpoint, KServe applies its default OTLP exporter,
                sampler and sampler-arg settings.
              type: boolean
            externalAccess:
              description: |-
                ExternalAccess is the client access path shown in the Routing UI:
                ClusterIP, LoadBalancer, NodePort, or EnvoyAIGateway. When set it takes
                precedence over EnableAIGateway and llmEngine.service.serviceType.
              type: string
            prefillMaxReplicas:
              description: |-
                PrefillMaxReplicas is the WVA autoscaling ceiling for the prefill
                workload. Required when prefill autoscaling is enabled.
              format: int32
              type: integer
            prefillMinReplicas:
              description: |-
                PrefillMinReplicas is the WVA autoscaling floor for the prefill workload.
                Setting PrefillMinReplicas or PrefillMaxReplicas enables
                spec.prefill.scaling, and PrefillReplicas is then ignored.
                Requires EnablePrefill. KServe requires ≥ 1.
              format: int32
              type: integer
            prefillPipelineParallelSize:
              description: |-
                PrefillPipelineParallelSize is vLLM pipeline parallelism for the prefill
                workload. Required when PrefillWorkerCount is set (must equal
                PrefillWorkerCount + 1). Alone it is a flag only — no prefill workers.
              format: int32
              type: integer
            prefillReplicas:
              description: |-
                PrefillReplicas sets the number of replicas for the prefill workload.
                Only used when EnablePrefill is true. Ignored when prefill autoscaling
                (PrefillMinReplicas / PrefillMaxReplicas) is set.
              format: int32
              type: integer
            prefillScalingActuator:
              description: |-
                PrefillScalingActuator selects the prefill WVA actuator: "keda" (default)
                or "hpa". When both decode and prefill autoscale, KServe requires the
                same actuator on both sides.
              type: string
            prefillWorkerCount:
              description: |-
                PrefillWorkerCount is extra prefill worker pods besides the prefill head.
                Presence turns on spec.prefill.worker. Requires EnablePrefill.
              format: int32
              type: integer
            prefillWorkerResources:
              description: |-
                PrefillWorkerResources are optional resources for prefill worker pods.
                Unset copies llmEngine.resources. Requires PrefillWorkerCount.
              properties:
                claims:
                  description: |-
                    Claims lists the names of resources, defined in spec.resourceClaims,
                    that are used by this container.

                    This field depends on the
                    DynamicResourceAllocation feature gate.

                    This field is immutable. It can only be set for containers.
                  items:
                    description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                    properties:
                      name:
                        description: |-
                          Name must match the name of one entry in pod.spec.resourceClaims of
                          the Pod where this field is used. It makes that resource available
                          inside a container.
                        type: string
                      request:
                        description: |-
                          Request is the name chosen for a request in the referenced claim.
                          If empty, everything from the claim is made available, otherwise
                          only the result of this request.
                        type: string
                    required:
                      - name
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - name
                  x-kubernetes-list-type: map
                limits:
                  additionalProperties:
                    anyOf:
                      - type: integer
                      - type: string
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  description: |-
                    Limits describes the maximum amount of compute resources allowed.
                    More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                  type: object
                requests:
                  additionalProperties:
                    anyOf:
                      - type: integer
                      - type: string
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  description: |-
                    Requests describes the minimum amount of compute resources required.
                    If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                    otherwise to an implementation-defined value. Requests cannot exceed Limits.
                    More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                  type: object
              type: object
            tokenLimitPerHour:
              description: |-
                TokenLimitPerHour is the per-API-key token quota for this model. It is used
                only when the Envoy AI Gateway is selected and the provider has a
                Redis-compatible rate-limit backend configured. Zero/unset uses the
                default limit.
              format: int32
              type: integer
            tracingEndpoint:
              description: |-
                TracingEndpoint overrides the OTLP exporter endpoint
                (OTEL_EXPORTER_OTLP_ENDPOINT). Only used when EnableTracing is true; empty
                keeps KServe's default collector endpoint.
              type: string
          type: object
    predictor:
      components:
        predictor: {}
      parametersSchema:
        openAPIV3Schema:
          description: |-
            PredictorTopologyParameters defines the topology-level parameters for the
            predictor topology. Per-model configuration lives on the predictor component;
            these are cross-cutting deployment options that shape the generated
            InferenceService.
          properties:
            enableMetrics:
              description: |-
                EnableMetrics emits a Prometheus Operator PodMonitor for the predictor
                pods. Unset means enabled, as for the llm topology.
              type: boolean
            externalAccess:
              description: |-
                ExternalAccess is the client access path: ClusterIP, LoadBalancer,
                NodePort, or EnvoyAIGateway (embedding models and custom containers
                that serve the OpenAI or TypeSafe API, through the provider's shared
                Gateway). When set it takes precedence over predictor.service.serviceType.
              type: string
            tokenLimitPerHour:
              description: |-
                TokenLimitPerHour is the per-API-key token quota for this model through
                the Envoy AI Gateway. Used only with a Redis-compatible rate-limit
                backend; unset uses the provider default.
              format: int32
              type: integer
          type: object
  uiSchema:
    llm:
      sections:
        advanced:
          components:
            config:
              fieldParams:
                label: LLMInferenceServiceConfig (spec)
                maxRows: 20
                minRows: 4
                multiline: true
                placeholder: |
                  template:
                    containers:
                      - name: main
                        args:
                          - --enforce-eager
                          - --enable-prefix-caching
              path: spec.components.llmEngine.parameters.config
              uiType: text
          componentsOrder:
            - config
          description: Provide a custom LLMInferenceServiceConfig spec (YAML) for runtime settings not exposed above — other vLLM args, env vars, or scheduling. The provider creates a config owned by this instance and merges it via baseRefs; it overrides the compute-profile preset, while the structured fields above still take precedence. Enter only the config spec body.
          label: Advanced
        basicInfo:
          components:
            imagePullSecret:
              fieldParams:
                helperText: 'For an OCI image model in a private registry: a Secret in the Instance namespace.'
                label: Image pull secret
                placeholder: None (public registry)
              path: spec.components.llmEngine.parameters.imagePullSecret
              uiType: text
              validation:
                regex:
                  message: Must be a valid Secret name (lowercase letters, digits, '-' and '.')
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
            modelName:
              fieldParams:
                label: Served Model Name
                placeholder: Defaults to the instance name
              path: spec.components.llmEngine.parameters.modelName
              uiType: text
            modelURI:
              fieldParams:
                label: Model
                optionsPath: spec.uiSchema.llm.modelCatalog
                optionsPathConfig:
                  labelPath: label
                  valuePath: uri
              path: spec.components.llmEngine.parameters.modelURI
              uiType: select
              validation:
                required: true
            version:
              fieldParams:
                label: vLLM Runtime Version
                optionsPath: spec.componentTypes.vllm.versions
                optionsPathConfig:
                  defaultValuePath: spec.componentTypes.vllm.defaultVersion
                  labelPath: version
                  valuePath: version
              path: spec.components.llmEngine.version
              uiType: select
              validation:
                required: true
          componentsOrder:
            - modelURI
            - imagePullSecret
            - modelName
            - version
          description: Configure the model to serve.
          label: Basic Information
        disaggregation:
          components:
            enablePrefill:
              fieldParams:
                defaultValue: false
                label: Enable Prefill/Decode Disaggregation
              path: spec.topology.parameters.enablePrefill
              uiType: toggle
            prefillAutoscaling:
              components:
                bounds:
                  components:
                    prefillMaxReplicas:
                      fieldParams:
                        label: Prefill max replicas
                      path: spec.topology.parameters.prefillMaxReplicas
                      uiType: number
                      validation:
                        celExpressions:
                          - celExpr: '!has(spec.topology.parameters.prefillMaxReplicas) || spec.topology.parameters.enablePrefill == true'
                            message: Prefill autoscaling requires Enable Prefill/Decode Disaggregation
                        max: 32
                        min: 1
                        required: true
                    prefillMinReplicas:
                      fieldParams:
                        label: Prefill min replicas
                        placeholder: "1"
                      path: spec.topology.parameters.prefillMinReplicas
                      uiType: number
                      validation:
                        celExpressions:
                          - celExpr: '!has(spec.topology.parameters.prefillMinReplicas) || spec.topology.parameters.enablePrefill == true'
                            message: Prefill autoscaling requires Enable Prefill/Decode Disaggregation
                          - celExpr: '!has(spec.topology.parameters.prefillMinReplicas) || !has(spec.topology.parameters.prefillMaxReplicas) || spec.topology.parameters.prefillMinReplicas <= spec.topology.parameters.prefillMaxReplicas'
                            message: Prefill min replicas cannot exceed Prefill max replicas
                        max: 32
                        min: 1
                  componentsOrder:
                    - prefillMinReplicas
                    - prefillMaxReplicas
                  groupType: line
                  uiType: group
                prefillScalingActuator:
                  fieldParams:
                    displayEmpty: true
                    helperText: KEDA (default) or HPA.
                    label: Prefill autoscaling actuator
                    options:
                      - label: KEDA
                        value: keda
                      - label: HPA
                        value: hpa
                  path: spec.topology.parameters.prefillScalingActuator
                  uiType: select
              componentsOrder:
                - bounds
                - prefillScalingActuator
              description: Scale prefill replicas with KServe WVA. When decode also autoscales, both must use the same actuator.
              groupType: toggleable
              label: Prefill autoscaling
              uiType: group
            prefillMultiNode:
              components:
                prefillWorkerResources:
                  components:
                    cpu:
                      fieldParams:
                        label: Prefill worker CPU
                        placeholder: Same as head
                      path: spec.topology.parameters.prefillWorkerResources.limits.cpu
                      uiType: number
                    memory:
                      fieldParams:
                        badge: Gi
                        badgeToApi: true
                        label: Prefill worker Memory
                        placeholder: Same as head
                      path: spec.topology.parameters.prefillWorkerResources.limits.memory
                      uiType: number
                  componentsOrder:
                    - cpu
                    - memory
                  groupType: line
                  uiType: group
                sizes:
                  components:
                    prefillPipelineParallelSize:
                      fieldParams:
                        helperText: Must equal Prefill worker count + 1.
                        label: Prefill pipeline parallel size
                      path: spec.topology.parameters.prefillPipelineParallelSize
                      uiType: number
                      validation:
                        celExpressions:
                          - celExpr: '!has(spec.topology.parameters.prefillWorkerCount) || (has(spec.topology.parameters.prefillPipelineParallelSize) && spec.topology.parameters.prefillPipelineParallelSize == spec.topology.parameters.prefillWorkerCount + 1)'
                            message: Prefill pipeline parallel size must equal Prefill worker count + 1
                        max: 16
                        min: 1
                        required: true
                    prefillWorkerCount:
                      fieldParams:
                        helperText: Worker pods besides the prefill head.
                        label: Prefill worker count
                      path: spec.topology.parameters.prefillWorkerCount
                      uiType: number
                      validation:
                        celExpressions:
                          - celExpr: '!has(spec.topology.parameters.prefillWorkerCount) || spec.topology.parameters.enablePrefill == true'
                            message: Prefill workers require Enable Prefill/Decode Disaggregation
                        max: 16
                        min: 1
                        required: true
                  componentsOrder:
                    - prefillWorkerCount
                    - prefillPipelineParallelSize
                  groupType: line
                  uiType: group
              componentsOrder:
                - sizes
                - prefillWorkerResources
              description: Shard each prefill copy across several nodes with pipeline parallelism.
              groupType: toggleable
              label: Prefill multi-node workers
              uiType: group
            prefillReplicas:
              fieldParams:
                defaultValue: 1
                helperText: Fixed prefill replica count. Ignored while Prefill autoscaling is on.
                label: Prefill replicas
              path: spec.topology.parameters.prefillReplicas
              uiType: number
              validation:
                max: 32
                min: 0
          componentsOrder:
            - enablePrefill
            - prefillReplicas
            - prefillAutoscaling
            - prefillMultiNode
          description: Split prefill and decode into independently scaled deployments (llm-d pattern). The settings below apply to the prefill workload.
