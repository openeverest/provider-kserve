                  type: integer
                maxRank:
                  format: int32
                  type: integer
              type: object
            loraDeployment:
              type: string
            loraSlot1:
              type: string
            loraSlot2:
              type: string
            loraSlot3:
              type: string
            maxReplicas:
              format: int32
              type: integer
            minReplicas:
              format: int32
