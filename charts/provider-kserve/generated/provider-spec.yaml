                  type: array
                limits:
                  additionalProperties:
                    properties:
                      format:
                        type: string
                    type: object
                  type: object
                requests:
                  additionalProperties:
                    properties:
                      format:
                        type: string
                    type: object
                  type: object
              type: object
          type: object
      type: vllm
    predictor:
      parametersSchema:
        openAPIV3Schema:
          properties:
            maxReplicas:
              format: int32
              type: integer
            minReplicas:
              format: int32
              type: integer
            modelFormat:
              type: string
            runtime:
              type: string
            runtimeVersion:
              type: string
            storageURI:
              type: string
          type: object
      type: modelServer
  topologies:
    llm:
      components:
        llmEngine: {}
      parametersSchema:
        openAPIV3Schema:
          properties:
            enableAIGateway:
              type: boolean
            enableGatewayRouting:
              type: boolean
            enableMetrics:
              type: boolean
            enablePrefill:
              type: boolean
            enableTracing:
              type: boolean
            externalAccess:
              type: string
            prefillMaxReplicas:
              format: int32
              type: integer
            prefillMinReplicas:
              format: int32
              type: integer
            prefillPipelineParallelSize:
              format: int32
              type: integer
            prefillReplicas:
              format: int32
              type: integer
            prefillScalingActuator:
              type: string
            prefillWorkerCount:
              format: int32
              type: integer
            prefillWorkerResources:
              properties:
                claims:
                  items:
                    properties:
                      name:
                        type: string
                      request:
                        type: string
                    type: object
                  type: array
                limits:
                  additionalProperties:
                    properties:
                      format:
                        type: string
                    type: object
                  type: object
                requests:
                  additionalProperties:
                    properties:
                      format:
                        type: string
                    type: object
                  type: object
              type: object
            tokenLimitPerHour:
              format: int32
              type: integer
            tracingEndpoint:
              type: string
          type: object
  uiSchema:
    llm:
      sections:
        advanced:
          components:
            config:
              fieldParams:
                label: LLMInferenceServiceConfig (spec)
                maxRows: 20
                minRows: 4
                multiline: true
                placeholder: |
                  template:
                    containers:
                      - name: main
                        args:
                          - --enforce-eager
                          - --max-model-len=2048
              path: spec.components.llmEngine.parameters.config
              uiType: text
          componentsOrder:
            - config
          description: Provide a custom LLMInferenceServiceConfig spec (YAML) for runtime settings not exposed above — extra vLLM args, env vars, or scheduling. The provider creates a config owned by this instance and merges it via baseRefs; it overrides the compute-profile preset, while the structured fields above still take precedence. Enter only the config spec body.
          label: Advanced
        basicInfo:
          components:
            modelName:
              fieldParams:
                label: Served Model Name
                placeholder: Defaults to the instance name
              path: spec.components.llmEngine.parameters.modelName
              uiType: text
            modelURI:
              fieldParams:
                label: Model
                optionsPath: spec.uiSchema.llm.modelCatalog
                optionsPathConfig:
                  labelPath: label
                  valuePath: uri
              path: spec.components.llmEngine.parameters.modelURI
              uiType: select
              validation:
                required: true
            version:
              fieldParams:
                label: vLLM Runtime Version
                optionsPath: spec.componentTypes.vllm.versions
                optionsPathConfig:
                  labelPath: version
                  valuePath: version
              path: spec.components.llmEngine.version
              uiType: select
              validation:
                required: true
          componentsOrder:
            - modelURI
            - modelName
            - version
          description: Configure the model to serve.
          label: Basic Information
        disaggregation:
          components:
            enablePrefill:
              fieldParams:
                defaultValue: "false"
                label: Enable Prefill/Decode Disaggregation
                options:
                  - label: Disabled
                    value: "false"
                  - label: Enabled
                    value: "true"
              path: spec.topology.parameters.enablePrefill
              uiType: select
            prefillMaxReplicas:
              fieldParams:
                helperText: Prefill WVA ceiling. Required to enable prefill autoscaling.
                label: Prefill max replicas
              path: spec.topology.parameters.prefillMaxReplicas
              uiType: number
              validation:
                celExpressions:
                  - celExpr: '!has(spec.topology.parameters.prefillMaxReplicas) || spec.topology.parameters.enablePrefill == "true"'
                    message: Prefill max replicas requires Enable Prefill/Decode Disaggregation
                max: 32
                min: 1
            prefillMinReplicas:
              fieldParams:
                helperText: Prefill WVA floor. Enables prefill autoscaling; must be ≥ 1.
                label: Prefill min replicas
              path: spec.topology.parameters.prefillMinReplicas
              uiType: number
              validation:
                celExpressions:
                  - celExpr: '!has(spec.topology.parameters.prefillMinReplicas) || spec.topology.parameters.enablePrefill == "true"'
                    message: Prefill min replicas requires Enable Prefill/Decode Disaggregation
                  - celExpr: '!has(spec.topology.parameters.prefillMinReplicas) || !has(spec.topology.parameters.prefillMaxReplicas) || spec.topology.parameters.prefillMinReplicas <= spec.topology.parameters.prefillMaxReplicas'
                    message: Prefill min replicas cannot exceed Prefill max replicas
                max: 32
                min: 1
            prefillPipelineParallelSize:
              fieldParams:
                helperText: Prefill stages. Required when Prefill worker count is set (must equal count + 1).
                label: Prefill pipeline parallel size
              path: spec.topology.parameters.prefillPipelineParallelSize
              uiType: number
              validation:
                celExpressions:
                  - celExpr: '!has(spec.topology.parameters.prefillPipelineParallelSize) || spec.topology.parameters.enablePrefill == "true"'
                    message: Prefill pipeline parallel size requires Enable Prefill/Decode Disaggregation
                max: 16
                min: 1
            prefillReplicas:
              fieldParams:
                defaultValue: 1
                helperText: Fixed prefill replica count. Ignored when Prefill min/max replicas are set.
                label: Prefill Replicas
              path: spec.topology.parameters.prefillReplicas
              uiType: number
              validation:
                max: 32
                min: 0
            prefillScalingActuator:
              fieldParams:
                displayEmpty: true
                helperText: Must match decode actuator when both sides autoscale. KEDA (default) or HPA.
                label: Prefill autoscaling actuator
                options:
                  - label: KEDA
                    value: keda
                  - label: HPA
                    value: hpa
              path: spec.topology.parameters.prefillScalingActuator
              uiType: select
              validation:
                celExpressions:
                  - celExpr: '!has(spec.topology.parameters.prefillScalingActuator) || spec.topology.parameters.enablePrefill == "true"'
                    message: Prefill autoscaling actuator requires Enable Prefill/Decode Disaggregation
                  - celExpr: '!has(spec.topology.parameters.prefillScalingActuator) || has(spec.topology.parameters.prefillMaxReplicas) || has(spec.topology.parameters.prefillMinReplicas)'
                    message: Prefill autoscaling actuator requires Prefill min or max replicas
            prefillWorkerCount:
              fieldParams:
                helperText: Extra prefill nodes besides the prefill head. Turns on spec.prefill.worker.
                label: Prefill worker count
              path: spec.topology.parameters.prefillWorkerCount
              uiType: number
              validation:
                celExpressions:
                  - celExpr: '!has(spec.topology.parameters.prefillWorkerCount) || spec.topology.parameters.enablePrefill == "true"'
                    message: Prefill worker count requires Enable Prefill/Decode Disaggregation
                  - celExpr: '!has(spec.topology.parameters.prefillWorkerCount) || (has(spec.topology.parameters.prefillPipelineParallelSize) && spec.topology.parameters.prefillPipelineParallelSize == spec.topology.parameters.prefillWorkerCount + 1)'
                    message: Prefill pipeline parallel size must equal Prefill worker count + 1
                max: 16
                min: 1
            prefillWorkerResources:
              components:
                cpu:
                  fieldParams:
                    label: Prefill worker CPU
                  path: spec.topology.parameters.prefillWorkerResources.limits.cpu
                  uiType: number
                memory:
                  fieldParams:
                    badge: Gi
                    badgeToApi: true
                    label: Prefill worker Memory
                  path: spec.topology.parameters.prefillWorkerResources.limits.memory
                  uiType: number
              groupType: line
              uiType: group
              validation:
                celExpressions:
                  - celExpr: '!has(spec.topology.parameters.prefillWorkerResources) || has(spec.topology.parameters.prefillWorkerCount)'
                    message: Prefill worker resources require Prefill worker count
          componentsOrder:
            - enablePrefill
            - prefillReplicas
            - prefillMinReplicas
            - prefillMaxReplicas
            - prefillScalingActuator
            - prefillPipelineParallelSize
            - prefillWorkerCount
            - prefillWorkerResources
          description: Split prefill and decode into independently scaled deployments (llm-d pattern).
          label: Disaggregated Serving
        lora:
          components:
            loraDeployment:
              fieldParams:
                defaultValue: disabled
                label: LoRA deployment
                options:
                  - label: Base model only
                    value: disabled
                  - label: Base + LoRA adapters
                    value: enabled
              path: spec.components.llmEngine.parameters.loraDeployment
              uiType: select
            loraSlot1:
              fieldParams:
                displayEmpty: true
                helperText: Optional. Served model name comes from the catalog entry.
                label: Adapter 1
                optionsPath: spec.uiSchema.llm.loraCatalog
                optionsPathConfig:
                  labelPath: label
                  valuePath: name
              path: spec.components.llmEngine.parameters.loraSlot1
              uiType: select
            loraSlot2:
              fieldParams:
                displayEmpty: true
                label: Adapter 2
                optionsPath: spec.uiSchema.llm.loraCatalog
                optionsPathConfig:
                  labelPath: label
                  valuePath: name
              path: spec.components.llmEngine.parameters.loraSlot2
              uiType: select
            loraSlot3:
              fieldParams:
                displayEmpty: true
                label: Adapter 3
                optionsPath: spec.uiSchema.llm.loraCatalog
                optionsPathConfig:
                  labelPath: label
                  valuePath: name
              path: spec.components.llmEngine.parameters.loraSlot3
              uiType: select
            maxAdapters:
              fieldParams:
                helperText: Maps to vLLM --max-loras
                label: Max Loaded Adapters
                placeholder: Defaults to adapter count
              path: spec.components.llmEngine.parameters.lora.maxAdapters
              uiType: number
              validation:
                min: 1
            maxCpuAdapters:
              fieldParams:
                helperText: Maps to vLLM --max-cpu-loras
                label: Max CPU-resident Adapters
                placeholder: Defaults to adapter count
              path: spec.components.llmEngine.parameters.lora.maxCpuAdapters
              uiType: number
              validation:
                min: 1
            maxRank:
              fieldParams:
                helperText: Maps to vLLM --max-lora-rank
                label: Max LoRA Rank
                placeholder: vLLM default (16)
              path: spec.components.llmEngine.parameters.lora.maxRank
              uiType: number
              validation:
                min: 1
          componentsOrder:
            - loraDeployment
            - loraSlot1
            - loraSlot2
            - loraSlot3
            - maxRank
            - maxAdapters
            - maxCpuAdapters
          description: Serve LoRA fine-tunes on top of the base model. Each adapter is addressable by name in OpenAI requests (model field). Adapters are chosen from the operator catalog (chart loraAdapters); up to three per Instance.
          label: LoRA Adapters
        observability:
          components:
            enableMetrics:
              fieldParams:
                defaultValue: "true"
                helperText: Emits a PodMonitor for this instance's vLLM /metrics endpoint. Requires Prometheus Operator in the cluster.
                label: vLLM Prometheus metrics
                options:
                  - label: Enabled
                    value: "true"
                  - label: Disabled
                    value: "false"
              path: spec.topology.parameters.enableMetrics
              uiType: select
            enableTracing:
              fieldParams:
                defaultValue: "false"
                helperText: Enables KServe distributed tracing across the gateway, scheduler and model components. Requires an OpenTelemetry collector.
                label: Distributed tracing (OTLP)
                options:
                  - label: Disabled
                    value: "false"
                  - label: Enabled
                    value: "true"
              path: spec.topology.parameters.enableTracing
              uiType: select
            tracingEndpoint:
              fieldParams:
                helperText: Optional OTLP endpoint (OTEL_EXPORTER_OTLP_ENDPOINT). Only used when tracing is enabled; empty keeps KServe's default collector.
                label: OTLP exporter endpoint
                placeholder: http://otel-collector:4317
              path: spec.topology.parameters.tracingEndpoint
              uiType: text
          componentsOrder:
            - enableMetrics
            - enableTracing
            - tracingEndpoint
          description: 'Configure Prometheus metrics for this model''s vLLM engine (per-instance PodMonitor). Envoy AI Gateway gen_ai metrics are cluster-wide: enabled automatically when the provider is installed with aiGateway.enabled and metrics.podMonitor.enabled — view them in Grafana (gateway dashboard).'
          label: Observability
        routing:
          components:
            externalAccess:
              fieldParams:
                defaultValue: ClusterIP
                label: External access
                options:
                  - label: ClusterIP
                    value: ClusterIP
                  - label: LoadBalancer
                    value: LoadBalancer
                  - label: NodePort
                    value: NodePort
                  - label: Envoy AI Gateway
                    value: EnvoyAIGateway
              path: spec.topology.parameters.externalAccess
              uiType: select
            tokenLimitPerHour:
              fieldParams:
                helperText: Only with Envoy AI Gateway. Leave empty for the default (1000) when a Redis/Valkey rate-limit backend is configured.
                label: Tokens per User per Hour
              path: spec.topology.parameters.tokenLimitPerHour
              uiType: number
              validation:
                celExpressions:
                  - celExpr: '!has(spec.topology.parameters.tokenLimitPerHour) || spec.topology.parameters.externalAccess == "EnvoyAIGateway"'
                    message: Tokens per User per Hour requires External access = Envoy AI Gateway
                min: 1
          componentsOrder:
            - externalAccess
            - tokenLimitPerHour
          description: 'Configure how clients reach the model. Pick one external access path: a per-instance Service (ClusterIP / LoadBalancer / NodePort), or the shared Envoy AI Gateway (token metering and optional per-user quotas).'
          label: Routing
        runtime:
          components:
            computeProfile:
              fieldParams:
                defaultValue: gpu
                label: Compute Profile
                options:
                  - label: GPU (default)
                    value: gpu
                  - label: CPU
                    value: cpu
              path: spec.components.llmEngine.parameters.computeProfile
              uiType: select
            kvCacheSpaceGi:
              fieldParams:
                badge: Gi
                label: CPU KV Cache Space
                placeholder: Auto (vLLM sizes from free memory)
              path: spec.components.llmEngine.parameters.kvCacheSpaceGi
              uiType: number
              validation:
                min: 1
            resources:
              components:
                cpu:
                  fieldParams:
                    defaultValue: 2
                    label: CPU
                    step: 1
                  path: spec.components.llmEngine.resources.limits.cpu
                  uiType: number
                  validation:
                    min: 0.5
                    required: true
                memory:
                  fieldParams:
                    badge: Gi
                    badgeToApi: true
                    defaultValue: 16
                    label: Memory
                    step: 1
                  path: spec.components.llmEngine.resources.limits.memory
                  uiType: number
                  validation:
                    min: 1
                    required: true
              groupType: line
              uiType: group
          componentsOrder:
            - computeProfile
            - resources
            - kvCacheSpaceGi
          description: Choose the compute profile and size the model server. GPU uses the default CUDA vLLM image; CPU composes a CPU-only vLLM config (via baseRefs) so the model runs without a GPU. CPU/Memory are applied to the model server container per instance.
          label: Runtime
        scaling:
          components:
            dataParallelSize:
              fieldParams:
                defaultValue: 1
                label: Data Parallel Size
              path: spec.components.llmEngine.parameters.dataParallelSize
              uiType: number
              validation:
                max: 16
                min: 1
            expertParallel:
              fieldParams:
                defaultValue: disabled
                label: Expert Parallelism (MoE)
                options:
                  - label: Disabled
                    value: disabled
                  - label: Enabled
                    value: enabled
              path: spec.components.llmEngine.parameters.expertParallel
              uiType: select
            maxReplicas:
              fieldParams:
                helperText: Autoscaling ceiling. Required to enable WVA autoscaling on decode.
                label: Max replicas
              path: spec.components.llmEngine.parameters.maxReplicas
              uiType: number
              validation:
                max: 32
                min: 1
            minReplicas:
              fieldParams:
                helperText: Autoscaling floor (KServe WVA). Enables autoscaling; must be ≥ 1.
                label: Min replicas
              path: spec.components.llmEngine.parameters.minReplicas
              uiType: number
              validation:
                celExpressions:
                  - celExpr: '!has(spec.components.llmEngine.parameters.minReplicas) || !has(spec.components.llmEngine.parameters.maxReplicas) || spec.components.llmEngine.parameters.minReplicas <= spec.components.llmEngine.parameters.maxReplicas'
                    message: Min replicas cannot exceed Max replicas
                max: 32
                min: 1
            pipelineParallelSize:
              fieldParams:
                defaultValue: 1
                helperText: Stages in one sharded model. When Worker count is set this must equal Worker count + 1 (head plus workers).
                label: Pipeline Parallel Size
              path: spec.components.llmEngine.parameters.pipelineParallelSize
              uiType: number
              validation:
                max: 16
                min: 1
            replicas:
              fieldParams:
                defaultValue: 1
                helperText: Fixed decode replica count. Ignored when Min/Max replicas are set.
                label: Replicas
              path: spec.components.llmEngine.replicas
              uiType: number
              validation:
                max: 32
                min: 0
            scalingActuator:
              fieldParams:
                displayEmpty: true
                helperText: Used when Min/Max replicas are set. KEDA (default) queries Prometheus directly; HPA needs a Prometheus Adapter.
                label: Autoscaling actuator
                options:
                  - label: KEDA
                    value: keda
                  - label: HPA
                    value: hpa
              path: spec.components.llmEngine.parameters.scalingActuator
              uiType: select
              validation:
                celExpressions:
                  - celExpr: '!has(spec.components.llmEngine.parameters.scalingActuator) || has(spec.components.llmEngine.parameters.maxReplicas) || has(spec.components.llmEngine.parameters.minReplicas)'
                    message: Autoscaling actuator requires Min or Max replicas
            tensorParallelSize:
              fieldParams:
                defaultValue: 1
                label: Tensor Parallel Size
              path: spec.components.llmEngine.parameters.tensorParallelSize
              uiType: number
              validation:
                max: 16
                min: 1
            workerCount:
              fieldParams:
                helperText: Extra decode nodes besides the head (one sharded model). Turns on KServe spec.worker. Must equal Pipeline parallel size − 1. Replicas/min/max still count whole head+worker rings.
                label: Worker count
              path: spec.components.llmEngine.parameters.workerCount
              uiType: number
              validation:
                celExpressions:
                  - celExpr: '!has(spec.components.llmEngine.parameters.workerCount) || (has(spec.components.llmEngine.parameters.pipelineParallelSize) && spec.components.llmEngine.parameters.pipelineParallelSize == spec.components.llmEngine.parameters.workerCount + 1)'
                    message: Pipeline parallel size must equal Worker count + 1
                max: 16
                min: 1
            workerResources:
              components:
                cpu:
                  fieldParams:
                    helperText: Optional. Empty copies the head resources.
                    label: Worker CPU
                  path: spec.components.llmEngine.parameters.workerResources.limits.cpu
                  uiType: number
                memory:
                  fieldParams:
                    badge: Gi
                    badgeToApi: true
                    label: Worker Memory
                  path: spec.components.llmEngine.parameters.workerResources.limits.memory
                  uiType: number
              groupType: line
              uiType: group
              validation:
                celExpressions:
                  - celExpr: '!has(spec.components.llmEngine.parameters.workerResources) || has(spec.components.llmEngine.parameters.workerCount)'
                    message: Worker resources require Worker count
          description: Fixed replica count, or WVA autoscaling (KV-cache / queue-depth) via min/max. Autoscaling ignores Replicas. KServe minReplicas is ≥ 1 (no scale-to-zero).
          label: Scaling & Parallelism
      sectionsOrder:
        - basicInfo
        - scaling
        - runtime
        - lora
        - routing
        - disaggregation
        - observability
        - advanced
  versions:
    - components:
        llmEngine: 0.25.1
        predictor: 0.20.0
      default: true
      name: "0.20"
