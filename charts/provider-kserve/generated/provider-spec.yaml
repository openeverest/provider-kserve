                      path: spec.components.llmEngine.parameters.engine.maxNumSeqs
                      uiType: number
                      validation:
                        int: true
                        min: 1
                  componentsOrder:
                    - maxModelLen
                    - maxNumSeqs
                    - gpuMemoryUtilization
                  groupType: line
                  uiType: group
              description: Lower the context length first when vLLM fails to start with a KV cache or out-of-memory error.
              groupType: bordered
              label: Context & batching
              uiType: group
            precision:
              components:
                types:
                  components:
                    dtype:
                      fieldParams:
                        displayEmpty: true
                        helperText: --dtype
                        label: Weights dtype
                        options:
                          - label: vLLM default
                            value: ""
                          - label: bfloat16
                            value: bfloat16
                          - label: float16
                            value: float16
                          - label: float32
                            value: float32
                      path: spec.components.llmEngine.parameters.engine.dtype
                      uiType: select
                    kvCacheDtype:
                      fieldParams:
                        displayEmpty: true
                        helperText: --kv-cache-dtype. FP8 fits about twice the tokens.
                        label: KV cache dtype
                        options:
                          - label: vLLM default
                            value: ""
                          - label: fp8
                            value: fp8
                          - label: fp8_e4m3
                            value: fp8_e4m3
                          - label: fp8_e5m2
                            value: fp8_e5m2
                      path: spec.components.llmEngine.parameters.engine.kvCacheDtype
                      uiType: select
                    quantization:
                      fieldParams:
                        displayEmpty: true
                        helperText: --quantization
                        label: Quantization
                        options:
                          - label: vLLM default
                            value: ""
                          - label: FP8 (on load, Ada/Hopper+)
                            value: fp8
                          - label: bitsandbytes 4-bit (on load)
                            value: bitsandbytes
                          - label: AWQ (Marlin)
                            value: awq_marlin
                          - label: GPTQ (Marlin)
                            value: gptq_marlin
                          - label: compressed-tensors
                            value: compressed-tensors
                      path: spec.components.llmEngine.parameters.engine.quantization
                      uiType: select
                  componentsOrder:
                    - dtype
                    - quantization
                    - kvCacheDtype
                  groupType: line
                  uiType: group
              description: 'Keep Quantization on vLLM default for pre-quantized checkpoints (AWQ, GPTQ, FP8): vLLM detects them on its own.'
              groupType: bordered
              label: Precision
              uiType: group
            reasoning:
              components:
                reasoningParser:
                  fieldParams:
                    helperText: --reasoning-parser
                    label: Reasoning parser
                    options:
                      - label: qwen3 (Qwen 3)
                        value: qwen3
                      - label: deepseek_r1 (DeepSeek-R1, QwQ)
                        value: deepseek_r1
                      - label: deepseek_v3 (DeepSeek-V3.1)
                        value: deepseek_v3
                      - label: openai_gptoss (gpt-oss)
                        value: openai_gptoss
                      - label: glm45 (GLM-4.5, GLM-4.6)
                        value: glm45
                      - label: kimi_k2 (Kimi K2)
                        value: kimi_k2
                      - label: granite (Granite 3.2+)
                        value: granite
                      - label: mistral (Magistral)
                        value: mistral
                      - label: gemma4 (Gemma 4)
                        value: gemma4
                      - label: minimax_m2 (MiniMax-M2)
                        value: minimax_m2
                      - label: nemotron_v3 (Nemotron 3)
                        value: nemotron_v3
                      - label: seed_oss (Seed-OSS)
                        value: seed_oss
                  path: spec.components.llmEngine.parameters.engine.reasoningParser
                  uiType: select
                  validation:
                    required: true
              description: 'For reasoning models: returns the model''s thinking in a separate reasoning_content field instead of mixing it into the answer.'
              groupType: toggleable
              label: Reasoning output
              uiType: group
            toolCalling:
              components:
                toolCallParser:
                  fieldParams:
                    helperText: --enable-auto-tool-choice --tool-call-parser
                    label: Tool call parser
                    options:
                      - label: hermes (Qwen 2.5, Qwen 3, Hermes)
                        value: hermes
                      - label: qwen3_coder (Qwen3-Coder)
                        value: qwen3_coder
                      - label: llama3_json (Llama 3.1–3.3)
                        value: llama3_json
                      - label: llama4_pythonic (Llama 4)
                        value: llama4_pythonic
                      - label: mistral (Mistral, Mixtral)
                        value: mistral
                      - label: openai (gpt-oss)
                        value: openai
                      - label: deepseek_v3 (DeepSeek-V3, R1)
                        value: deepseek_v3
                      - label: deepseek_v31 (DeepSeek-V3.1)
                        value: deepseek_v31
                      - label: glm45 (GLM-4.5, GLM-4.6)
                        value: glm45
                      - label: kimi_k2 (Kimi K2)
                        value: kimi_k2
                      - label: granite (Granite 3)
                        value: granite
                      - label: granite4 (Granite 4)
                        value: granite4
                      - label: gemma4 (Gemma 4)
                        value: gemma4
                      - label: phi4_mini_json (Phi-4-mini)
                        value: phi4_mini_json
                      - label: minimax_m2 (MiniMax-M2)
                        value: minimax_m2
                      - label: xlam (xLAM)
                        value: xlam
                      - label: pythonic (Llama 3.2, ToolACE)
                        value: pythonic
                  path: spec.components.llmEngine.parameters.engine.toolCallParser
                  uiType: select
                  validation:
                    required: true
              description: Lets clients send OpenAI tools and get tool calls back. Pick the parser that matches the model's chat template.
              groupType: toggleable
              label: Tool calling
              uiType: group
          componentsOrder:
            - memory
            - precision
            - toolCalling
            - reasoning
          description: vLLM engine settings. Empty fields keep vLLM's defaults. Each one maps to a vllm serve flag and wins over the same flag in the Advanced config.
          label: Engine Tuning
        lora:
          components:
            adapters:
              components:
                loraSlot1:
                  fieldParams:
                    defaultValue: ""
                    displayEmpty: true
                    helperText: From the operator catalog (chart loraAdapters), up to three. Used when LoRA deployment is Base + LoRA adapters.
                    label: Adapter 1
                    optionsPath: spec.uiSchema.llm.loraCatalog
                    optionsPathConfig:
                      labelPath: label
                      valuePath: name
                  path: spec.components.llmEngine.parameters.loraSlot1
                  uiType: select
                loraSlot2:
                  fieldParams:
                    defaultValue: ""
                    displayEmpty: true
                    label: Adapter 2
                    optionsPath: spec.uiSchema.llm.loraCatalog
                    optionsPathConfig:
                      labelPath: label
                      valuePath: name
                  path: spec.components.llmEngine.parameters.loraSlot2
                  uiType: select
                loraSlot3:
                  fieldParams:
                    defaultValue: ""
                    displayEmpty: true
                    label: Adapter 3
                    optionsPath: spec.uiSchema.llm.loraCatalog
                    optionsPathConfig:
                      labelPath: label
                      valuePath: name
                  path: spec.components.llmEngine.parameters.loraSlot3
                  uiType: select
              componentsOrder:
                - loraSlot1
                - loraSlot2
                - loraSlot3
              groupType: accordion
              label: Adapters
              uiType: group
            limits:
              components:
                values:
                  components:
                    maxAdapters:
                      fieldParams:
                        helperText: --max-loras
                        label: Max loaded adapters
                        placeholder: Adapter count
                      path: spec.components.llmEngine.parameters.lora.maxAdapters
                      uiType: number
                      validation:
                        min: 1
                    maxCpuAdapters:
                      fieldParams:
                        helperText: --max-cpu-loras
                        label: Max CPU-resident adapters
                        placeholder: Adapter count
                      path: spec.components.llmEngine.parameters.lora.maxCpuAdapters
                      uiType: number
                      validation:
                        min: 1
                    maxRank:
                      fieldParams:
                        helperText: --max-lora-rank
                        label: Max LoRA rank
                        placeholder: vLLM default (16)
                      path: spec.components.llmEngine.parameters.lora.maxRank
                      uiType: number
                      validation:
                        min: 1
                  componentsOrder:
                    - maxRank
                    - maxAdapters
                    - maxCpuAdapters
                  groupType: line
                  uiType: group
              componentsOrder:
                - values
              groupType: accordion
              label: Adapter limits
              uiType: group
            loraDeployment:
              fieldParams:
                defaultValue: disabled
                label: LoRA deployment
                options:
                  - label: Base model only
                    value: disabled
                  - label: Base + LoRA adapters
                    value: enabled
              path: spec.components.llmEngine.parameters.loraDeployment
              uiType: select
          componentsOrder:
            - loraDeployment
            - adapters
            - limits
          description: Serve LoRA fine-tunes on top of the base model. Each adapter is addressable by name in OpenAI requests (model field).
          label: LoRA Adapters
        observability:
          components:
            enableMetrics:
              fieldParams:
                defaultValue: true
                helperText: Emits a PodMonitor for this instance's vLLM /metrics endpoint. Requires Prometheus Operator in the cluster.
                label: vLLM Prometheus metrics
              path: spec.topology.parameters.enableMetrics
              uiType: toggle
            enableTracing:
              fieldParams:
                defaultValue: false
                helperText: Enables KServe distributed tracing across the gateway, scheduler and model components. Requires an OpenTelemetry collector.
                label: Distributed tracing (OTLP)
              path: spec.topology.parameters.enableTracing
              uiType: toggle
            tracingEndpoint:
              fieldParams:
                helperText: Optional OTLP endpoint (OTEL_EXPORTER_OTLP_ENDPOINT). Only used when tracing is enabled; empty keeps KServe's default collector.
                label: OTLP exporter endpoint
                placeholder: http://otel-collector:4317
              path: spec.topology.parameters.tracingEndpoint
              uiType: text
          componentsOrder:
            - enableMetrics
            - enableTracing
            - tracingEndpoint
          description: 'Configure Prometheus metrics for this model''s vLLM engine (per-instance PodMonitor). Envoy AI Gateway gen_ai metrics are cluster-wide: enabled automatically when the provider is installed with aiGateway.enabled and metrics.podMonitor.enabled — view them in Grafana (gateway dashboard).'
          label: Observability
        routing:
          components:
            externalAccess:
              fieldParams:
                defaultValue: ClusterIP
                label: External access
                options:
                  - label: ClusterIP
                    value: ClusterIP
                  - label: LoadBalancer
                    value: LoadBalancer
                  - label: NodePort
                    value: NodePort
                  - label: Envoy AI Gateway
                    value: EnvoyAIGateway
              path: spec.topology.parameters.externalAccess
              uiType: select
            tokenLimitPerHour:
              fieldParams:
                helperText: Only with Envoy AI Gateway. Leave empty for the default (1000) when a Redis/Valkey rate-limit backend is configured.
                label: Tokens per User per Hour
              path: spec.topology.parameters.tokenLimitPerHour
              uiType: number
              validation:
                celExpressions:
                  - celExpr: '!has(spec.topology.parameters.tokenLimitPerHour) || spec.topology.parameters.externalAccess == "EnvoyAIGateway"'
                    message: Tokens per User per Hour requires External access = Envoy AI Gateway
                min: 1
          componentsOrder:
            - externalAccess
            - tokenLimitPerHour
          description: 'Configure how clients reach the model. Pick one external access path: a per-instance Service (ClusterIP / LoadBalancer / NodePort), or the shared Envoy AI Gateway (API key per model, token metering and optional per-key quotas).'
          label: Routing
        runtime:
          components:
            computeProfile:
              fieldParams:
                defaultValue: gpu
                label: Compute Profile
                options:
                  - label: GPU (default)
                    value: gpu
                  - label: CPU
                    value: cpu
              path: spec.components.llmEngine.parameters.computeProfile
              uiType: select
            gpuCount:
              fieldParams:
                helperText: Number of GPUs (nvidia.com/gpu) each model pod requests. GPU profile only — leave empty for CPU. Empty defaults to 1 on GPU. Must be ≥ Tensor parallel size.
                label: GPUs per pod
                placeholder: 1 on GPU, none on CPU
              path: spec.components.llmEngine.parameters.gpuCount
              uiType: number
              validation:
                celExpressions:
                  - celExpr: '!has(spec.components.llmEngine.parameters.gpuCount) || spec.components.llmEngine.parameters.computeProfile != "cpu"'
                    message: GPUs per pod is only valid for the GPU compute profile
                max: 16
                min: 1
            kvCacheSpaceGi:
              fieldParams:
                badge: Gi
                label: CPU KV Cache Space
                placeholder: Auto (vLLM sizes from free memory)
              path: spec.components.llmEngine.parameters.kvCacheSpaceGi
              uiType: number
              validation:
                min: 1
            resources:
              components:
                cpu:
                  fieldParams:
                    defaultValue: 2
                    label: CPU
                    step: 1
                  path: spec.components.llmEngine.resources.limits.cpu
                  uiType: number
                  validation:
                    min: 0.5
                    required: true
                memory:
                  fieldParams:
                    badge: Gi
                    badgeToApi: true
                    defaultValue: 16
                    label: Memory
                    step: 1
                  path: spec.components.llmEngine.resources.limits.memory
                  uiType: number
                  validation:
                    min: 1
                    required: true
              groupType: line
              uiType: group
          componentsOrder:
            - computeProfile
            - gpuCount
            - resources
            - kvCacheSpaceGi
          description: Choose the compute profile and size the model server. GPU uses the default CUDA vLLM image; CPU composes a CPU-only vLLM config (via baseRefs) so the model runs without a GPU. CPU/Memory are applied to the model server container per instance.
          label: Runtime
        scaling:
          components:
            autoscaling:
              components:
                bounds:
                  components:
                    maxReplicas:
                      fieldParams:
                        label: Max replicas
                      path: spec.components.llmEngine.parameters.maxReplicas
                      uiType: number
                      validation:
                        max: 32
                        min: 1
                        required: true
                    minReplicas:
                      fieldParams:
                        label: Min replicas
                        placeholder: "1"
                      path: spec.components.llmEngine.parameters.minReplicas
                      uiType: number
                      validation:
                        celExpressions:
                          - celExpr: '!has(spec.components.llmEngine.parameters.minReplicas) || !has(spec.components.llmEngine.parameters.maxReplicas) || spec.components.llmEngine.parameters.minReplicas <= spec.components.llmEngine.parameters.maxReplicas'
                            message: Min replicas cannot exceed Max replicas
                        max: 32
                        min: 1
                  componentsOrder:
                    - minReplicas
                    - maxReplicas
                  groupType: line
                  uiType: group
                scalingActuator:
                  fieldParams:
                    displayEmpty: true
                    helperText: KEDA (default) queries Prometheus directly; HPA needs a Prometheus Adapter.
                    label: Autoscaling actuator
                    options:
                      - label: KEDA
                        value: keda
                      - label: HPA
                        value: hpa
                  path: spec.components.llmEngine.parameters.scalingActuator
                  uiType: select
              componentsOrder:
                - bounds
                - scalingActuator
              description: Scale decode replicas on KV-cache and queue load (KServe WVA) instead of a fixed count. No scale-to-zero.
              groupType: toggleable
              label: Autoscaling
              uiType: group
            multiNode:
              components:
                workerCount:
                  fieldParams:
                    helperText: Worker pods besides the head. Set Pipeline parallel size (under Parallelism) to Worker count + 1.
                    label: Worker count
                  path: spec.components.llmEngine.parameters.workerCount
                  uiType: number
                  validation:
                    celExpressions:
                      - celExpr: '!has(spec.components.llmEngine.parameters.workerCount) || (has(spec.components.llmEngine.parameters.pipelineParallelSize) && spec.components.llmEngine.parameters.pipelineParallelSize == spec.components.llmEngine.parameters.workerCount + 1)'
                        message: Pipeline parallel size must equal Worker count + 1
                    max: 16
                    min: 1
                    required: true
                workerResources:
                  components:
                    cpu:
                      fieldParams:
                        label: Worker CPU
                        placeholder: Same as head
                      path: spec.components.llmEngine.parameters.workerResources.limits.cpu
                      uiType: number
                    memory:
                      fieldParams:
                        badge: Gi
                        badgeToApi: true
                        label: Worker Memory
                        placeholder: Same as head
                      path: spec.components.llmEngine.parameters.workerResources.limits.memory
                      uiType: number
                  componentsOrder:
                    - cpu
                    - memory
                  groupType: line
                  uiType: group
              componentsOrder:
                - workerCount
                - workerResources
              description: Shard one model copy across several nodes with pipeline parallelism. Each replica is a head plus its workers.
              groupType: toggleable
              label: Multi-node workers
              uiType: group
            parallelism:
              components:
                expertParallel:
                  fieldParams:
                    defaultValue: disabled
                    label: Expert parallelism (MoE)
                    options:
                      - label: Disabled
                        value: disabled
                      - label: Enabled
                        value: enabled
                  path: spec.components.llmEngine.parameters.expertParallel
                  uiType: select
                sizes:
                  components:
                    dataParallelSize:
                      fieldParams:
                        defaultValue: 1
                        helperText: Model copies sharing experts (MoE). Not with Pipeline parallel size > 1.
                        label: Data parallel size
                      path: spec.components.llmEngine.parameters.dataParallelSize
                      uiType: number
                      validation:
                        max: 16
                        min: 1
                    pipelineParallelSize:
                      fieldParams:
                        defaultValue: 1
                        helperText: Model stages. With Multi-node workers it must equal Worker count + 1.
                        label: Pipeline parallel size
                      path: spec.components.llmEngine.parameters.pipelineParallelSize
                      uiType: number
                      validation:
                        max: 16
                        min: 1
                    tensorParallelSize:
                      fieldParams:
                        defaultValue: 1
                        helperText: GPUs one model copy is split across on a node.
                        label: Tensor parallel size
                      path: spec.components.llmEngine.parameters.tensorParallelSize
                      uiType: number
                      validation:
                        max: 16
                        min: 1
                  componentsOrder:
                    - tensorParallelSize
                    - pipelineParallelSize
                    - dataParallelSize
                  groupType: line
                  uiType: group
              componentsOrder:
                - sizes
                - expertParallel
              groupType: accordion
              label: Parallelism
              uiType: group
            replicas:
              fieldParams:
                defaultValue: 1
                helperText: Fixed decode replica count. Ignored while Autoscaling is on.
                label: Replicas
              path: spec.components.llmEngine.replicas
              uiType: number
              validation:
                max: 32
                min: 0
          componentsOrder:
            - replicas
            - autoscaling
            - parallelism
            - multiNode
          description: How many copies of the model run, and how one copy is split across GPUs and nodes.
          label: Scaling & Parallelism
        scheduling:
          components:
            podSchedulingPolicy:
              components:
                policy:
                  uiType: widget
                  widgetType: podSchedulingPolicy
              groupType: bordered
              label: Pod scheduling policy
              uiType: group
          label: Scheduling
      sectionsOrder:
        - basicInfo
        - scaling
        - runtime
        - engine
        - lora
        - routing
        - disaggregation
        - observability
        - scheduling
        - advanced
    predictor:
      sections:
        advanced:
          components:
            config:
              fieldParams:
                label: InferenceService (spec)
                maxRows: 20
                minRows: 4
                multiline: true
                placeholder: |
                  predictor:
                    containers:
                      - name: kserve-container
                        args:
                          - --model-id=BAAI/bge-small-en-v1.5
              path: spec.components.predictor.parameters.config
              uiType: text
          componentsOrder:
            - config
          description: InferenceService spec fields not exposed above (YAML), merged into the generated spec; the fields above win. With a custom container, list it as kserve-container to add arguments, env or volume mounts; a container named transformer-container runs next to it and receives the traffic.
          label: Advanced
        basicInfo:
          components:
            customContainer:
              components:
                apiSchema:
                  fieldParams:
                    displayEmpty: true
                    helperText: The API the image serves. Required to publish the container on the Envoy AI Gateway.
                    label: API for the Envoy AI Gateway
                    options:
                      - label: OpenAI (under /v1)
                        value: OpenAI
                      - label: TypeSafe System One (POST /v1/systemone)
                        value: TypeSafe
                  path: spec.components.predictor.parameters.apiSchema
                  uiType: select
                backendAPIKeySecret:
                  fieldParams:
                    helperText: Secret in the Instance namespace whose apiKey entry the Envoy AI Gateway sends to the image as a bearer token. Only with Envoy AI Gateway.
                    label: Backend API key secret
                  path: spec.components.predictor.parameters.backendAPIKeySecret
                  uiType: text
                  validation:
                    celExpressions:
                      - celExpr: '!has(spec.components.predictor.parameters.backendAPIKeySecret) || spec.topology.parameters.externalAccess == "EnvoyAIGateway"'
                        message: Backend API key secret requires External access = Envoy AI Gateway
                healthPath:
                  fieldParams:
                    helperText: Returns 200 once the model is loaded; the pod gets no traffic before that. Empty sends traffic as soon as the container starts.
                    label: Health path
                    placeholder: /health
                  path: spec.components.predictor.parameters.healthPath
                  uiType: text
                image:
                  fieldParams:
                    label: Image
                    placeholder: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
                  path: spec.components.predictor.parameters.image
                  uiType: text
                  validation:
                    celExpressions:
                      - celExpr: '!has(spec.components.predictor.parameters.modelFormat)'
                        message: Turn off Custom model to serve a custom container
                    required: true
                imagePullSecret:
                  fieldParams:
                    helperText: Secret in the Instance namespace for a private registry.
                    label: Image pull secret
                  path: spec.components.predictor.parameters.imagePullSecret
                  uiType: text
                port:
                  fieldParams:
                    helperText: HTTP port the image listens on.
                    label: Port
                    placeholder: "8080"
                  path: spec.components.predictor.parameters.port
                  uiType: number
                  validation:
                    int: true
                    max: 65535
                    min: 1
                servedModelName:
                  fieldParams:
                    helperText: The model name the server expects in requests (e.g. vLLM's --served-model-name).
                    label: Served model name
                  path: spec.components.predictor.parameters.servedModelName
                  uiType: text
              componentsOrder:
                - image
                - port
                - healthPath
                - apiSchema
                - servedModelName
                - backendAPIKeySecret
                - imagePullSecret
              description: Serve the model with your own image (e.g. vLLM, Text Embeddings Inference, llama.cpp, NVIDIA NIM) instead of a KServe serving runtime. Add arguments, environment variables, volumes or a helper container under Advanced.
              groupType: toggleable
              label: Custom container
              uiType: group
            customModel:
              components:
                modelFormat:
                  fieldParams:
                    helperText: KServe picks the serving runtime that supports this format.
                    label: Model Format
                    options:
                      - label: Hugging Face (Transformers, embeddings)
                        value: huggingface
                      - label: scikit-learn
                        value: sklearn
                      - label: XGBoost
                        value: xgboost
                      - label: LightGBM
                        value: lightgbm
                      - label: PyTorch (TorchServe)
                        value: pytorch
                      - label: TensorFlow
                        value: tensorflow
                      - label: ONNX
                        value: onnx
                      - label: Triton
                        value: triton
                      - label: TensorRT
                        value: tensorrt
                      - label: MLflow
                        value: mlflow
                      - label: PMML
                        value: pmml
                      - label: PaddlePaddle
                        value: paddle
                      - label: AutoGluon
                        value: autogluon
                  path: spec.components.predictor.parameters.modelFormat
                  uiType: select
                  validation:
                    required: true
                storageURI:
                  fieldParams:
                    helperText: hf://, s3://, gs://, pvc:// or https:// location of the model.
                    label: Model Storage URI
                    placeholder: hf://sentence-transformers/all-MiniLM-L6-v2
                  path: spec.components.predictor.parameters.storageURI
                  uiType: text
                  validation:
                    required: true
                task:
                  fieldParams:
                    displayEmpty: true
                    helperText: Hugging Face only. Empty lets the runtime infer it from the model.
                    label: Task
                    options:
                      - label: Text embedding
                        value: text_embedding
                      - label: Sequence classification
                        value: sequence_classification
                      - label: Token classification
                        value: token_classification
                      - label: Fill mask
                        value: fill_mask
                      - label: Text generation
                        value: text_generation
                      - label: Text-to-text generation
                        value: text2text_generation
                  path: spec.components.predictor.parameters.task
                  uiType: select
                  validation:
                    celExpressions:
                      - celExpr: '!has(spec.components.predictor.parameters.task) || spec.components.predictor.parameters.modelFormat == "huggingface"'
                        message: Task requires Model Format = Hugging Face
              componentsOrder:
                - modelFormat
                - storageURI
                - task
              description: Serve your own model instead of the catalog entry.
              groupType: toggleable
              label: Custom model
              uiType: group
            model:
              fieldParams:
                helperText: Pick a model from the catalog, or turn on Custom model or Custom container below.
                label: Model
                optionsPath: spec.uiSchema.predictor.modelCatalog
                optionsPathConfig:
                  labelPath: label
                  valuePath: name
              path: spec.components.predictor.parameters.model
              uiType: select
              validation:
                required: true
            version:
              fieldParams:
                label: KServe Version
                optionsPath: spec.componentTypes.modelServer.versions
                optionsPathConfig:
                  defaultValuePath: spec.componentTypes.modelServer.defaultVersion
                  labelPath: version
                  valuePath: version
              path: spec.components.predictor.version
              uiType: select
              validation:
                required: true
          componentsOrder:
            - model
            - customModel
            - customContainer
            - version
          description: Configure the model to serve.
          label: Basic Information
        observability:
          components:
            enableMetrics:
              fieldParams:
                defaultValue: true
                helperText: Emits a PodMonitor for the model server's metrics endpoint. Requires the Prometheus Operator in the cluster.
                label: Prometheus metrics
              path: spec.topology.parameters.enableMetrics
              uiType: toggle
          componentsOrder:
            - enableMetrics
          label: Observability
        resources:
          components:
            resources:
              components:
                cpu:
                  fieldParams:
                    defaultValue: 2
                    label: CPU
                    step: 1
                  path: spec.components.predictor.resources.limits.cpu
                  uiType: number
                  validation:
                    min: 0.5
                    required: true
                gpuCount:
                  fieldParams:
                    label: GPUs
                    placeholder: From the model
                    step: 1
                  path: spec.components.predictor.parameters.gpuCount
                  uiType: number
                  validation:
                    int: true
                    max: 8
                    min: 0
                memory:
                  fieldParams:
                    badge: Gi
                    badgeToApi: true
                    defaultValue: 4
                    label: Memory
                    step: 1
                  path: spec.components.predictor.resources.limits.memory
                  uiType: number
                  validation:
                    min: 1
                    required: true
              groupType: line
              uiType: group
          componentsOrder:
            - resources
          description: CPU, memory and GPUs for each model server pod.
          label: Resources
        routing:
          components:
            externalAccess:
              fieldParams:
                defaultValue: ClusterIP
                helperText: Envoy AI Gateway serves text embedding models and custom containers that serve the OpenAI or TypeSafe API.
                label: External access
                options:
                  - label: ClusterIP
                    value: ClusterIP
                  - label: LoadBalancer
                    value: LoadBalancer
                  - label: NodePort
                    value: NodePort
                  - label: Envoy AI Gateway
                    value: EnvoyAIGateway
              path: spec.topology.parameters.externalAccess
              uiType: select
            tokenLimitPerHour:
              fieldParams:
                helperText: Only with Envoy AI Gateway. Leave empty for the default (1000) when a Redis/Valkey rate-limit backend is configured.
                label: Tokens per User per Hour
              path: spec.topology.parameters.tokenLimitPerHour
              uiType: number
              validation:
                celExpressions:
                  - celExpr: '!has(spec.topology.parameters.tokenLimitPerHour) || spec.topology.parameters.externalAccess == "EnvoyAIGateway"'
                    message: Tokens per User per Hour requires External access = Envoy AI Gateway
                min: 1
          componentsOrder:
            - externalAccess
            - tokenLimitPerHour
          description: How clients reach the model. ClusterIP stays in-cluster; LoadBalancer and NodePort create a Service in front of the predictor pods; Envoy AI Gateway publishes an embedding model or a custom container that serves the OpenAI or TypeSafe API on the shared Gateway, with an API key.
          label: Routing
        runtime:
          components:
            runtime:
              fieldParams:
                label: Serving Runtime
                placeholder: Auto-selected from the model format
              path: spec.components.predictor.parameters.runtime
              uiType: text
            runtimeVersion:
              fieldParams:
                label: Runtime Version
              path: spec.components.predictor.parameters.runtimeVersion
              uiType: text
            storageContainer:
              fieldParams:
                label: Storage Container
              path: spec.components.predictor.parameters.storageContainer
              uiType: text
          componentsOrder:
            - runtime
            - runtimeVersion
            - storageContainer
          description: Optional overrides for how the model is served and downloaded.
          label: Serving Runtime
        scaling:
          components:
            maxReplicas:
              fieldParams:
                label: Max Replicas
              path: spec.components.predictor.parameters.maxReplicas
              uiType: number
              validation:
                max: 32
                min: 1
            minReplicas:
              fieldParams:
                defaultValue: 1
                label: Min Replicas
              path: spec.components.predictor.parameters.minReplicas
              uiType: number
              validation:
                celExpressions:
                  - celExpr: '!has(spec.components.predictor.parameters.minReplicas) || !has(spec.components.predictor.parameters.maxReplicas) || spec.components.predictor.parameters.minReplicas <= spec.components.predictor.parameters.maxReplicas'
                    message: Min Replicas cannot exceed Max Replicas
                max: 32
                min: 1
          componentsOrder:
            - minReplicas
            - maxReplicas
          description: Autoscaling bounds for the predictor.
          label: Scaling
        scheduling:
          components:
            podSchedulingPolicy:
              components:
                policy:
                  uiType: widget
                  widgetType: podSchedulingPolicy
              groupType: bordered
              label: Pod scheduling policy
              uiType: group
          label: Scheduling
      sectionsOrder:
        - basicInfo
        - runtime
        - resources
        - scaling
        - routing
        - observability
        - scheduling
        - advanced
