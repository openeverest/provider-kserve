        engine:
          components:
            memory:
              components:
                limits:
                  components:
                    gpuMemoryUtilization:
                      fieldParams:
                        helperText: --gpu-memory-utilization, 0–1. Host memory on CPU.
                        label: GPU memory utilization
                        placeholder: vLLM default
                        step: 0.05
                      path: spec.components.llmEngine.parameters.engine.gpuMemoryUtilization
                      uiType: number
                      validation:
                        max: 1
                        min: 0.01
                    maxModelLen:
                      fieldParams:
                        badge: tokens
                        helperText: --max-model-len
                        label: Max context length
                        placeholder: Model maximum
                      path: spec.components.llmEngine.parameters.engine.maxModelLen
                      uiType: number
                      validation:
                        int: true
                        min: 1
                    maxNumSeqs:
                      fieldParams:
                        helperText: --max-num-seqs
