apiVersion: v2
name: provider-kserve
description: A Helm chart for deploying the OpenEverest provider-kserve provider
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - openeverest
  - provider
  - database
home: https://github.com/openeverest/provider-kserve
sources:
  - https://github.com/openeverest/provider-kserve
maintainers:
  - name: OpenEverest Contributors
# The provider translates Instances into KServe custom resources, so the KServe
# CRDs must exist in the cluster before this chart is installed. They are not
# part of this chart: install KServe's kserve-crd and kserve-llmisvc-crd charts
# as their own releases (`make helm-install-crds`). Bundled here they pushed the
# release over Kubernetes' 1 MiB Secret limit, and Helm never upgrades CRDs
# from a chart's crds/ directory.
#
# The provider only translates Instances into KServe custom resources — it does
# not reconcile them. The KServe controllers that do are bundled as subchart
# dependencies so a single `helm install` yields a working stack (mirroring how
# provider-valkey bundles the valkey-operator). Each controller and cert-manager
# can be toggled off via values (see values.yaml) when managed out of band.
#
# The KServe charts are pulled from KServe's published OCI registry
# (oci://ghcr.io/kserve/charts), all pinned to one version. Run `make helm-deps`
# to vendor the dependencies into `charts/`.
# KServe never published v0.21.0 charts (the v0.21.0 tag still carries the
# v0.21.0-rc1 charts, identical apart from the version), so the rc1 charts are
# pinned and values.yaml sets kserve.version to run the v0.21.0 images.
dependencies:
  # cert-manager issues the admission-webhook certificates the KServe
  # controllers require. Off by default; normally installed beforehand.
  - name: cert-manager
    version: "v1.16.2"
    repository: https://charts.jetstack.io
    condition: cert-manager.enabled
  # KServe InferenceService controller + webhook — reconciles the predictor
  # topology. Owns the shared KServe resources (config ConfigMap, self-signed
  # Issuer, ClusterStorageContainer).
  - name: kserve-resources
    alias: kserveResources
    version: "v0.21.0-rc1"
    repository: "oci://ghcr.io/kserve/charts"
    condition: kserveResources.enabled
  # KServe LLMInferenceService controller + webhook — reconciles the llm
  # topology (vLLM). Shared resources are disabled here to avoid colliding with
  # kserve-resources (see values.yaml).
  - name: kserve-llmisvc-resources
    alias: kserveLlmisvcResources
    version: "v0.21.0-rc1"
    repository: "oci://ghcr.io/kserve/charts"
    condition: kserveLlmisvcResources.enabled
  # Optional Envoy data-plane controller. Agent Router (formerly Envoy AI
  # Gateway) v1.2 requires Envoy Gateway v1.9+ (Gateway API v1.6 CRDs) and the
  # xDS extension-manager integration configured in values.yaml.
  - name: gateway-helm
    alias: envoy-gateway
    version: "v1.9.2"
    repository: "oci://docker.io/envoyproxy"
    condition: envoy-gateway.enabled
  # Envoy AI Gateway installs its CRDs separately from its controller chart.
  # The project is now Agent Router; chart names and the API group are unchanged.
  - name: ai-gateway-crds-helm
    alias: envoy-ai-gateway-crds
    version: "v1.2.0"
    repository: "oci://docker.io/envoyproxy"
    condition: envoy-ai-gateway.enabled
  - name: ai-gateway-helm
    alias: envoy-ai-gateway
    version: "v1.2.0"
    repository: "oci://docker.io/envoyproxy"
    condition: envoy-ai-gateway.enabled
  # Optional LeaderWorkerSet controller for multi-node llm Instances
  # (workerCount). Pinned to the version KServe v0.21 is built against.
  - name: lws
    version: "0.8.0"
    repository: "oci://registry.k8s.io/lws/charts"
    condition: lws.enabled

