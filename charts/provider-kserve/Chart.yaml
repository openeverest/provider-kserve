apiVersion: v2
name: provider-kserve
description: A Helm chart for deploying the OpenEverest provider-kserve provider
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - openeverest
  - provider
  - database
home: https://github.com/openeverest/provider-kserve
sources:
  - https://github.com/openeverest/provider-kserve
maintainers:
  - name: OpenEverest Contributors
# The provider translates Instances into KServe custom resources, so the KServe
# CRDs must exist in the cluster. They are pulled as the kserve-crd and
# kserve-llmisvc-crd subcharts (same OCI registry and version as the
# controllers). Toggle off with kserveCrds.enabled=false when the cluster
# already provides them. Uninstall of this release deletes the CRDs unless
# that toggle is false.
#
# The provider only translates Instances into KServe custom resources — it does
# not reconcile them. The KServe controllers that do are bundled as subchart
# dependencies so a single `helm install` yields a working stack (mirroring how
# provider-valkey bundles the valkey-operator). Each controller and cert-manager
# can be toggled off via values (see values.yaml) when managed out of band.
#
# The KServe charts are pulled from KServe's published OCI registry
# (oci://ghcr.io/kserve/charts), all pinned to one version. Run `make helm-deps`
# to vendor the dependencies into `charts/`.
dependencies:
  # cert-manager issues the admission-webhook certificates the KServe
  # controllers require. Installed by default; set `cert-manager.enabled=false`
  # when the cluster already provides cert-manager (a common case).
  - name: cert-manager
    version: "v1.16.2"
    repository: https://charts.jetstack.io
    condition: cert-manager.enabled
  # KServe CRDs — InferenceService and supporting kinds. Same version as the
  # controller charts. Gated with the llmisvc CRDs by kserveCrds.enabled.
  - name: kserve-crd
    alias: kserveCrds
    version: "v0.20.0"
    repository: "oci://ghcr.io/kserve/charts"
    condition: kserveCrds.enabled
  # KServe CRDs — LLMInferenceService and LLMInferenceServiceConfig.
  # Also ships clusterstoragecontainers; helm-deps drops that copy so this
  # release does not apply the same CRD twice (kserve-crd keeps it).
  - name: kserve-llmisvc-crd
    alias: kserveLlmisvcCrds
    version: "v0.20.0"
    repository: "oci://ghcr.io/kserve/charts"
    condition: kserveCrds.enabled
  # KServe InferenceService controller + webhook — reconciles the predictor
  # topology. Owns the shared KServe resources (config ConfigMap, self-signed
  # Issuer, ClusterStorageContainer).
  - name: kserve-resources
    alias: kserveResources
    version: "v0.20.0"
    repository: "oci://ghcr.io/kserve/charts"
    condition: kserveResources.enabled
  # KServe LLMInferenceService controller + webhook — reconciles the llm
  # topology (vLLM). Shared resources are disabled here to avoid colliding with
  # kserve-resources (see values.yaml).
  - name: kserve-llmisvc-resources
    alias: kserveLlmisvcResources
    version: "v0.20.0"
    repository: "oci://ghcr.io/kserve/charts"
    condition: kserveLlmisvcResources.enabled
  # KServe runtime configurations — ships the well-known LLMInferenceServiceConfig
  # presets the llmisvc controller resolves (kserve-config-llm-*) and the
  # ClusterServingRuntimes the InferenceService controller selects by model
  # format. Without these the llm topology stalls with ConfigNotFound and the
  # predictor topology has no runtime to schedule.
  - name: kserve-runtime-configs
    alias: kserveRuntimeConfigs
    version: "v0.20.0"
    repository: "oci://ghcr.io/kserve/charts"
    condition: kserveRuntimeConfigs.enabled
  # Optional Envoy data-plane controller. AI Gateway v0.4 requires Envoy
  # Gateway v1.5+ and the xDS extension-manager integration configured in
  # values.yaml.
  - name: gateway-helm
    alias: envoy-gateway
    version: "v1.5.9"
    repository: "oci://docker.io/envoyproxy"
    condition: aiGateway.enabled
  # Envoy AI Gateway installs its CRDs separately from its controller chart.
  - name: ai-gateway-crds-helm
    alias: envoy-ai-gateway-crds
    version: "v0.4.0"
    repository: "oci://docker.io/envoyproxy"
    condition: aiGateway.enabled
  - name: ai-gateway-helm
    alias: envoy-ai-gateway
    version: "v0.4.0"
    repository: "oci://docker.io/envoyproxy"
    condition: aiGateway.enabled

