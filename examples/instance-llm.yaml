# Example Instance CR for the provider-kserve provider (llm topology).
#
# Serves a Large Language Model with vLLM via a KServe LLMInferenceService.
# This is the flagship path for OpenAI-compatible LLM inference.
#
# Prerequisites:
#   1. OpenEverest CRDs installed
#   2. Provider CR applied (definition/provider.yaml)
#   3. KServe installed with the LLMInferenceService (v1alpha2) CRD
#   4. Provider controller running
#   5. GPU nodes available for the model
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: llama-3-1-8b
  namespace: default
spec:
  # Provider reference.
  providerRef:
    name: provider-kserve

  # High-level version bundle — selects a curated vLLM runtime version.
  # Omit to use the provider's default bundle.
  version: "0.15"

  # Topology configuration — LLM serving.
  topology:
    type: llm
    parameters:
      # ClusterIP | LoadBalancer | NodePort | EnvoyAIGateway
      externalAccess: ClusterIP
      # Per-user quota when externalAccess is EnvoyAIGateway and the chart
      # has a Redis/Valkey rate-limit backend configured.
      # tokenLimitPerHour: 1000
      # Gateway API Inference Extension (prefix-cache aware routing).
      enableGatewayRouting: false
      # Disaggregated prefill/decode (llm-d pattern). Requires enough GPUs.
      enablePrefill: false
      # prefillReplicas: 1
      # Prefill WVA autoscaling (mutually exclusive with prefillReplicas).
      # prefillMinReplicas: 1
      # prefillMaxReplicas: 4
      # prefillScalingActuator: keda

  components:
    # vLLM inference engine (required).
    llmEngine:
      type: vllm
      # Number of decode replicas. Ignored when minReplicas/maxReplicas are set.
      replicas: 1
      # How the model is exposed (same pattern as MongoDB External access).
      # ClusterIP (default) keeps it in-cluster; LoadBalancer/NodePort create
      # an extra Service fronting the model pods.
      service:
        serviceType: ClusterIP
        # annotations:
        #   service.beta.kubernetes.io/aws-load-balancer-internal: "true"
        # loadBalancerService:
        #   sourceRanges:
        #     - 10.0.0.0/8
      resources:
        requests:
          cpu: "4"
          memory: 16Gi
          nvidia.com/gpu: "1"
        limits:
          nvidia.com/gpu: "1"
      parameters:
        # Model artifacts location (Hugging Face, S3, GCS or PVC).
        modelURI: hf://meta-llama/Llama-3.1-8B-Instruct
        # Name advertised in the "model" field of inference requests.
        modelName: llama-3.1-8b-instruct
        # WVA autoscaling (mutually exclusive with llmEngine.replicas).
        # minReplicas: 1
        # maxReplicas: 4
        # scalingActuator: keda
        # Split the model across GPUs on a node.
        tensorParallelSize: 1
        # pipelineParallelSize: 1
        # Data parallelism (replica layout); common for Mixture-of-Experts
        # models. Mutually exclusive with pipelineParallelSize.
        # dataParallelSize: 2
        # Expert parallelism for MoE models (Mixtral, DeepSeek, Qwen-MoE).
        # expertParallel: enabled
        # Inherit and override base runtime configs.
        # baseRefs:
        #   - kserve-config-llm-decode-worker-data-parallel
