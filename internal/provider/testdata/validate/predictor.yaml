apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: iris
spec:
  providerRef:
    name: provider-kserve
  topology:
    type: predictor
    parameters:
      externalAccess: ClusterIP
  components:
    predictor:
      replicas: 1
      parameters:
        modelFormat: sklearn
        storageURI: gs://kfserving-examples/models/sklearn/1.0/model
