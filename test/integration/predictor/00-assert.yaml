# The provider must reconcile the Instance into a KServe InferenceService with
# the requested model format, storage URI, and autoscaling bounds, in
# RawDeployment mode.
#
# The provider requests "RawDeployment" (common.DeploymentModeRaw), but KServe
# deprecated that value in favour of "Standard" and the v1beta1 webhook
# normalizes it on admission (constants.ParseDeploymentMode). The stored
# annotation is therefore "Standard", not what the provider wrote.
#
# The LLMInferenceService path is reconciled by the llmisvc controller and never
# passes through that webhook, so test/integration/llm still asserts the literal
# "RawDeployment". The asymmetry is intentional.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: test-kserve-predictor
  annotations:
    serving.kserve.io/deploymentMode: Standard
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 3
    model:
      modelFormat:
        name: sklearn
      storageUri: gs://kfserving-examples/models/sklearn/1.0/model
