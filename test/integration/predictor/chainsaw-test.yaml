---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: predictor
spec:
  description: |
    Lifecycle of a predictor Instance: create it, verify the provider derives a
    KServe InferenceService, simulate the KServe controller marking the service
    ready, verify the Instance reaches Ready, and verify the InferenceService is
    garbage collected on deletion.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,inferenceservice -o yaml
  steps:
    - name: create-predictor
      try:
        - apply:
            file: 00-create-predictor.yaml
        - assert:
            file: 00-assert.yaml

    # Simulate the KServe controller marking the InferenceService ready so the
    # provider can propagate a Ready phase back to the Instance.
    - name: predictor-ready
      try:
        - script:
            content: |
              kubectl patch inferenceservice/test-kserve-predictor --subresource status -n $NAMESPACE \
                --type=merge -p '{"status":{"url":"http://test-kserve-predictor.'"$NAMESPACE"'.example.com","conditions":[{"type":"Ready","status":"True","lastTransitionTime":"2026-01-01T00:00:00Z"}]}}'
        - assert:
            file: 10-assert.yaml

    - name: delete-predictor
      try:
        - script:
            content: kubectl -n $NAMESPACE delete instance/test-kserve-predictor --wait=false
        - error:
            file: 20-errors.yaml
        - wait:
            apiVersion: core.openeverest.io/v1alpha1
            kind: Instance
            name: test-kserve-predictor
            for:
              deletion: {}
