---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: llm
spec:
  description: |
    Lifecycle of an llm Instance: create it, verify the provider derives a
    KServe LLMInferenceService, and verify the LLMInferenceService is garbage
    collected on deletion.

    Readiness is deliberately NOT asserted here — see the note in
    ../predictor/chainsaw-test.yaml. The llmisvc controller owns
    LLMInferenceService.status the same way, so faking Ready is the same race;
    this path just used to win it more often.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,llminferenceservice -o yaml
  steps:
    - name: create-llm
      try:
        - apply:
            file: 00-create-llm.yaml
        - assert:
            file: 00-assert.yaml

    - name: delete-llm
      try:
        - script:
            content: kubectl -n $NAMESPACE delete instance/test-kserve-llm --wait=false
        - error:
            file: 20-errors.yaml
        - wait:
            apiVersion: core.openeverest.io/v1alpha1
            kind: Instance
            name: test-kserve-llm
            for:
              deletion: {}
