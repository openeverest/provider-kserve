# The provider must reconcile the Instance into a KServe LLMInferenceService
# with the requested model URI, name, replicas, and tensor parallelism.
#
# No deploymentMode annotation is asserted: the llmisvc controller has no
# Knative path and never reads it. Only InferenceService does (see
# ../predictor/00-assert.yaml).
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: test-kserve-llm
spec:
  replicas: 1
  model:
    uri: hf://meta-llama/Llama-3.1-8B-Instruct
    name: llama-3.1-8b-instruct
  parallelism:
    tensor: 1
