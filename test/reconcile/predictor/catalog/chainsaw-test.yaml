apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: predictor-catalog
spec:
  description: |
    parameters.model picks an entry from the chart's predictorModels catalog,
    which fills in the model format and storage URI. A GPU entry also requests
    a GPU and has vLLM pool embeddings, tolerates the GPU node taint and rolls
    out without a surge pod. A name that is not in the catalog is rejected at
    admission.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,inferenceservice -o yaml
  steps:
    - name: catalog-model
      try:
        - apply:
            file: 00-instance.yaml
        - assert:
            file: 00-assert-isvc.yaml

    - name: unknown-model
      try:
        - script:
            content: kubectl apply -n $NAMESPACE -f 10-instance-unknown.yaml
            check:
              ($error != null): true
              (contains($stderr, 'spec.components[predictor].parameters.model')): true

    - name: gpu-catalog-model
      try:
        - apply:
            file: 20-instance-gpu.yaml
        - assert:
            file: 20-assert-isvc-gpu.yaml
