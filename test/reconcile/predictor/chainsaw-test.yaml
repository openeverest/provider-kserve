---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: predictor
spec:
  description: |
    Lifecycle of a predictor Instance: create it, verify the provider derives a
    KServe InferenceService, and verify the InferenceService is garbage
    collected on deletion.

    Readiness is deliberately NOT asserted here. The real KServe controller
    owns InferenceService.status and rewrites it within a second, so patching
    the status to fake Ready is a race the test only sometimes wins (the fake
    Ready lived <1s in run 32052071713 before KServe reset it to
    IngressReady=False). Asserting readiness truthfully means waiting for a
    model pod to actually serve, which belongs in an e2e suite with a real
    model and real timeouts, not in the per-PR suite.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,inferenceservice -o yaml
  steps:
    - name: create-predictor
      try:
        - apply:
            file: 00-create-predictor.yaml
        - assert:
            file: 00-assert.yaml

    - name: delete-predictor
      try:
        - script:
            content: kubectl -n $NAMESPACE delete instance/test-kserve-predictor --wait=false
        - error:
            file: 20-errors.yaml
        - wait:
            apiVersion: core.openeverest.io/v1alpha1
            kind: Instance
            name: test-kserve-predictor
            for:
              deletion: {}
