apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: predictor-workload-spec
spec:
  description: |
    env, args and spec.components.predictor.schedulingPolicy reach the
    InferenceService predictor, and KServe carries them onto the predictor
    Deployment's pod template. A topology spread constraint without a selector
    gets the predictor pod labels. minReplicas 0 is rejected at admission:
    KServe Standard mode does not scale to zero.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,inferenceservice,deployment -o yaml
  steps:
    - name: workload-spec
      try:
        - apply:
            file: 00-instance.yaml
        - assert:
            file: 00-assert-isvc.yaml
        - assert:
            file: 00-assert-deployment.yaml

    - name: zero-min-replicas
      try:
        - script:
            content: kubectl apply -n $NAMESPACE -f 10-instance-zero-min.yaml
            check:
              ($error != null): true
              (contains($stderr, 'spec.components[predictor].parameters.minReplicas')): true
