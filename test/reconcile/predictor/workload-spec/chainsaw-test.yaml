apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: predictor-workload-spec
spec:
  description: |
    env, args and spec.components.predictor.schedulingPolicy reach the
    InferenceService predictor, and KServe carries them onto the predictor
    Deployment's pod template. A topology spread constraint without a selector
    gets the predictor pod labels. minReplicas 0 fails validation: KServe
    Standard mode does not scale to zero.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,inferenceservice,deployment -o yaml
  steps:
    - name: workload-spec
      try:
        - apply:
            file: 00-instance.yaml
        - assert:
            file: 00-assert-isvc.yaml
        - assert:
            file: 00-assert-deployment.yaml

    - name: zero-min-replicas
      try:
        - apply:
            file: 10-instance-zero-min.yaml
        - assert:
            resource:
              apiVersion: core.openeverest.io/v1alpha1
              kind: Instance
              metadata:
                name: test-predictor-zero-min
              status:
                (conditions[?type == 'Ready']):
                  - status: "False"
                    reason: ValidationFailed
