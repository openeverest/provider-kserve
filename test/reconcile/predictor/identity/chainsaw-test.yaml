apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: predictor-identity
spec:
  description: |
    serviceAccountName, labels, annotations and both security contexts reach
    the InferenceService, and KServe carries them onto the predictor pod
    template. A label the provider manages is rejected at admission.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,inferenceservice,deployment -o yaml
  steps:
    - name: identity
      try:
        - apply:
            file: 00-serviceaccount.yaml
        - apply:
            file: 00-instance.yaml
        - assert:
            file: 00-assert-isvc.yaml
        - assert:
            file: 00-assert-deployment.yaml

    - name: reserved-label
      try:
        - script:
            content: kubectl apply -n $NAMESPACE -f 10-instance-reserved-label.yaml
            check:
              ($error != null): true
              (contains($stderr, 'spec.components[predictor].parameters.labels[core.openeverest.io/instance]')): true
