apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: predictor-metrics
spec:
  description: |
    topology.parameters.enableMetrics (on by default) publishes the metrics
    endpoint the serving runtime declares in its prometheus.kserve.io
    annotations in status.monitoring.sources, read from a predictor pod;
    turning it off clears it. The PodMonitor earlier releases created per
    Instance is deleted.

    The PodMonitor CRD is installed if the cluster does not have it yet (the
    Tilt CI cluster runs without the Prometheus Operator), so the legacy
    PodMonitor can be created.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,inferenceservice,podmonitor,pod -o yaml
  steps:
    - name: podmonitor-crd
      try:
        - script:
            content: |
              kubectl get crd podmonitors.monitoring.coreos.com >/dev/null 2>&1 && exit 0
              kubectl apply --server-side -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/v0.94.1/example/prometheus-operator-crd/monitoring.coreos.com_podmonitors.yaml
              # kubectl wait fails instead of waiting while the new CRD has no status yet.
              for _ in $(seq 1 30); do
                kubectl get crd podmonitors.monitoring.coreos.com -o jsonpath='{.status.conditions[?(@.type=="Established")].status}' | grep -q True && exit 0
                sleep 2
              done
              echo "PodMonitor CRD not Established" >&2
              exit 1

    - name: enabled-by-default
      try:
        - apply:
            file: 00-legacy-podmonitor.yaml
        - apply:
            file: 00-instance.yaml
        - assert:
            file: 00-assert-sources.yaml
        - error:
            file: 00-errors-legacy-podmonitor.yaml

    - name: disabled
      try:
        - apply:
            file: 10-instance-disabled.yaml
        - assert:
            file: 10-assert-no-sources.yaml
