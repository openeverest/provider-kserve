# Llm topology definition.
# Wraps KServe LLMInferenceService (serving.kserve.io/v1alpha2) — the flagship
# path for serving Large Language Models with vLLM, tensor/pipeline parallelism,
# optional disaggregated prefill/decode, and Gateway API inference routing.
#
# config.components: Which components are used and their defaults.
# config.parametersSchema: Reference a Go type for topology parameters.
# ui: Rendering hints for the frontend form.
#
# See github.com/openeverest/provider-sdk/blob/main/PROVIDER_DEVELOPMENT.md
# for detailed guidance.
config:
  parametersSchema: LlmTopologyParameters
  components:
    llmEngine:
      defaults:
        replicas: 1
ui:
  sections:
    basicInfo:
      label: Basic Information
      description: Configure the model to serve.
      components:
        modelURI:
          uiType: select
          path: spec.components.llmEngine.parameters.modelURI
          fieldParams:
            label: Model
            # Options are loaded from spec.uiSchema.llm.modelCatalog on the
            # Provider CR, populated from the chart's `.Values.models` at install
            # time. spec.uiSchema is a PreserveUnknownFields region in the
            # Provider CRD, so the injected catalog survives apiserver pruning (a
            # plain spec.modelCatalog field would be dropped as unknown). It is
            # nested inside the `llm` topology node so it is not enumerated as a
            # selectable topology in the UI's topology dropdown. Operators
            # customize the catalog without regenerating this schema.
            optionsPath: spec.uiSchema.llm.modelCatalog
            optionsPathConfig:
              labelPath: label
              valuePath: uri
          validation:
            required: true
        imagePullSecret:
          uiType: text
          path: spec.components.llmEngine.parameters.imagePullSecret
          fieldParams:
            label: Image pull secret
            placeholder: None (public registry)
            helperText: >-
              For an OCI image model in a private registry: a Secret in the
              Instance namespace.
          validation:
            regex:
              pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
              message: Must be a valid Secret name (lowercase letters, digits, '-' and '.')
        modelName:
          uiType: text
          path: spec.components.llmEngine.parameters.modelName
          fieldParams:
            label: Served Model Name
            placeholder: Defaults to the instance name
        version:
          uiType: select
          path: spec.components.llmEngine.version
          fieldParams:
            label: vLLM Runtime Version
            optionsPath: spec.componentTypes.vllm.versions
            optionsPathConfig:
              labelPath: version
              valuePath: version
          validation:
            required: true
      componentsOrder:
      - modelURI
      - imagePullSecret
      - modelName
      - version
    scaling:
      label: Scaling & Parallelism
      description: >-
        How many copies of the model run, and how one copy is split across
        GPUs and nodes.
      components:
        replicas:
          uiType: number
          path: spec.components.llmEngine.replicas
          fieldParams:
            label: Replicas
            defaultValue: 1
            helperText: Fixed decode replica count. Ignored while Autoscaling is on.
          validation:
            min: 0
            max: 32
        autoscaling:
          uiType: group
          groupType: toggleable
          label: Autoscaling
          description: >-
            Scale decode replicas on KV-cache and queue load (KServe WVA)
            instead of a fixed count. No scale-to-zero.
          components:
            bounds:
              uiType: group
              groupType: line
              components:
                minReplicas:
                  uiType: number
                  path: spec.components.llmEngine.parameters.minReplicas
                  fieldParams:
                    label: Min replicas
                    placeholder: "1"
                  validation:
                    min: 1
                    max: 32
                    celExpressions:
                    - celExpr: '!has(spec.components.llmEngine.parameters.minReplicas) || !has(spec.components.llmEngine.parameters.maxReplicas) || spec.components.llmEngine.parameters.minReplicas <= spec.components.llmEngine.parameters.maxReplicas'
                      message: Min replicas cannot exceed Max replicas
                maxReplicas:
                  uiType: number
                  path: spec.components.llmEngine.parameters.maxReplicas
                  fieldParams:
                    label: Max replicas
                  validation:
                    required: true
                    min: 1
                    max: 32
              componentsOrder:
              - minReplicas
              - maxReplicas
            scalingActuator:
              uiType: select
              path: spec.components.llmEngine.parameters.scalingActuator
              fieldParams:
                label: Autoscaling actuator
                displayEmpty: true
                helperText: >-
                  KEDA (default) queries Prometheus directly; HPA needs a
                  Prometheus Adapter.
                options:
                - label: KEDA
                  value: keda
                - label: HPA
                  value: hpa
          componentsOrder:
          - bounds
          - scalingActuator
        parallelism:
          uiType: group
          groupType: accordion
          label: Parallelism
          components:
            sizes:
              uiType: group
              groupType: line
              components:
                tensorParallelSize:
                  uiType: number
                  path: spec.components.llmEngine.parameters.tensorParallelSize
                  fieldParams:
                    label: Tensor parallel size
                    defaultValue: 1
                    helperText: GPUs one model copy is split across on a node.
                  validation:
                    min: 1
                    max: 16
                pipelineParallelSize:
                  uiType: number
                  path: spec.components.llmEngine.parameters.pipelineParallelSize
                  fieldParams:
                    label: Pipeline parallel size
                    defaultValue: 1
                    helperText: >-
                      Model stages. With Multi-node workers it must equal
                      Worker count + 1.
                  validation:
                    min: 1
                    max: 16
                dataParallelSize:
                  uiType: number
                  path: spec.components.llmEngine.parameters.dataParallelSize
                  fieldParams:
                    label: Data parallel size
                    defaultValue: 1
                    helperText: >-
                      Model copies sharing experts (MoE). Not with Pipeline
                      parallel size > 1.
                  validation:
                    min: 1
                    max: 16
              componentsOrder:
              - tensorParallelSize
              - pipelineParallelSize
              - dataParallelSize
            expertParallel:
              uiType: select
              path: spec.components.llmEngine.parameters.expertParallel
              fieldParams:
                label: Expert parallelism (MoE)
                defaultValue: disabled
                options:
                - label: Disabled
                  value: disabled
                - label: Enabled
                  value: enabled
          componentsOrder:
          - sizes
          - expertParallel
        multiNode:
          uiType: group
          groupType: toggleable
          label: Multi-node workers
          description: >-
            Shard one model copy across several nodes with pipeline
            parallelism. Each replica is a head plus its workers.
          components:
            workerCount:
              uiType: number
              path: spec.components.llmEngine.parameters.workerCount
              fieldParams:
                label: Worker count
                helperText: >-
                  Worker pods besides the head. Set Pipeline parallel size
                  (under Parallelism) to Worker count + 1.
              validation:
                required: true
                min: 1
                max: 16
                celExpressions:
                - celExpr: '!has(spec.components.llmEngine.parameters.workerCount) || (has(spec.components.llmEngine.parameters.pipelineParallelSize) && spec.components.llmEngine.parameters.pipelineParallelSize == spec.components.llmEngine.parameters.workerCount + 1)'
                  message: Pipeline parallel size must equal Worker count + 1
            workerResources:
              uiType: group
              groupType: line
              components:
                cpu:
                  uiType: number
                  path: spec.components.llmEngine.parameters.workerResources.limits.cpu
                  fieldParams:
                    label: Worker CPU
                    placeholder: Same as head
                memory:
                  uiType: number
                  path: spec.components.llmEngine.parameters.workerResources.limits.memory
                  fieldParams:
                    label: Worker Memory
                    placeholder: Same as head
                    badge: Gi
                    badgeToApi: true
              componentsOrder:
              - cpu
              - memory
          componentsOrder:
          - workerCount
          - workerResources
      componentsOrder:
      - replicas
      - autoscaling
      - parallelism
      - multiNode
    runtime:
      label: Runtime
      description: Choose the compute profile and size the model server. GPU uses the default CUDA vLLM image; CPU composes a CPU-only vLLM config (via baseRefs) so the model runs without a GPU. CPU/Memory are applied to the model server container per instance.
      components:
        computeProfile:
          uiType: select
          path: spec.components.llmEngine.parameters.computeProfile
          fieldParams:
            label: Compute Profile
            defaultValue: gpu
            options:
            - label: GPU (default)
              value: gpu
            - label: CPU
              value: cpu
        gpuCount:
          uiType: number
          # GPU profile only. Written as a plain parameter (not resources.limits)
          # because the "nvidia.com/gpu" resource key cannot be expressed as a
          # dot-delimited path; the provider injects it into the model container's
          # resource limits (head and every worker). Leave empty for CPU.
          path: spec.components.llmEngine.parameters.gpuCount
          fieldParams:
            label: GPUs per pod
            placeholder: 1 on GPU, none on CPU
            helperText: >-
              Number of GPUs (nvidia.com/gpu) each model pod requests. GPU
              profile only — leave empty for CPU. Empty defaults to 1 on GPU.
              Must be ≥ Tensor parallel size.
          validation:
            min: 1
            max: 16
            celExpressions:
            - celExpr: '!has(spec.components.llmEngine.parameters.gpuCount) || spec.components.llmEngine.parameters.computeProfile != "cpu"'
              message: GPUs per pod is only valid for the GPU compute profile
        resources:
          uiType: group
          groupType: line
          components:
            cpu:
              uiType: number
              # Written to the standard component resources field, which the
              # provider applies to the LLMInferenceService "main" container.
              # KServe strategic-merges the instance spec last, so this wins over
              # the preset/baseRefs — a per-instance, finetuned resource sizing.
              path: spec.components.llmEngine.resources.limits.cpu
              fieldParams:
                label: CPU
                defaultValue: 2
                step: 1
              validation:
                min: 0.5
                required: true
            memory:
              uiType: number
              path: spec.components.llmEngine.resources.limits.memory
              fieldParams:
                label: Memory
                badge: Gi
                badgeToApi: true
                defaultValue: 16
                step: 1
              validation:
                min: 1
                required: true
        kvCacheSpaceGi:
          uiType: number
          # CPU profile only. Overrides VLLM_CPU_KVCACHE_SPACE (GiB). Left empty,
          # vLLM auto-sizes the KV cache from the memory that is free at startup,
          # which adapts to the node — recommended. Only set this to cap the KV
          # cache to a specific size; vLLM refuses to start if it exceeds the
          # host-free memory at that moment (the CPU runtime footprint is large
          # and model-independent), so keep it small unless Memory is generous.
          path: spec.components.llmEngine.parameters.kvCacheSpaceGi
          fieldParams:
            label: CPU KV Cache Space
            badge: Gi
            placeholder: Auto (vLLM sizes from free memory)
          validation:
            min: 1
      componentsOrder:
      - computeProfile
      - gpuCount
      - resources
      - kvCacheSpaceGi
    cache:
      label: Model Cache
      description: >-
        Cache this model on nodes in an existing KServe LocalModelNodeGroup.
        The provider creates a namespace cache owned by this instance. Disable
        the cache to remove it. The LocalModel chart feature must be enabled.
      components:
        cacheEnabled:
          uiType: select
          path: spec.components.llmEngine.parameters.localModelCache.enabled
          fieldParams:
            label: Enable model cache
            defaultValue: disabled
            options:
            - label: Disabled
              value: disabled
            - label: Enabled
              value: enabled
            helperText: >-
              Reuses one downloaded model copy per matching node instead of
              downloading the model for every Pod.
        modelSize:
          uiType: number
          path: spec.components.llmEngine.parameters.localModelCache.modelSize
          fieldParams:
            label: Model size
            badge: Gi
            badgeToApi: true
            helperText: Required storage for one model copy.
          validation:
            min: 1
            celExpressions:
            - celExpr: '!has(spec.components.llmEngine.parameters.localModelCache) || spec.components.llmEngine.parameters.localModelCache.enabled != "enabled" || has(spec.components.llmEngine.parameters.localModelCache.modelSize)'
              message: Model size is required when model caching is enabled
        nodeGroup:
          uiType: text
          path: spec.components.llmEngine.parameters.localModelCache.nodeGroup
          fieldParams:
            label: LocalModelNodeGroup
            placeholder: model-workers
            helperText: Existing cluster-scoped node group that supplies cache storage.
          validation:
            celExpressions:
            - celExpr: '!has(spec.components.llmEngine.parameters.localModelCache) || spec.components.llmEngine.parameters.localModelCache.enabled != "enabled" || has(spec.components.llmEngine.parameters.localModelCache.nodeGroup)'
              message: LocalModelNodeGroup is required when model caching is enabled
        serviceAccountName:
          uiType: text
          path: spec.components.llmEngine.parameters.localModelCache.serviceAccountName
          fieldParams:
            label: Download service account
            placeholder: model-puller
            helperText: >-
              Optional ServiceAccount for model credentials in the KServe
              LocalModel jobs namespace.
      componentsOrder:
      - cacheEnabled
      - modelSize
      - nodeGroup
      - serviceAccountName
    engine:
      label: Engine Tuning
      description: >-
        vLLM engine settings. Empty fields keep vLLM's defaults. Each one maps
        to a vllm serve flag and wins over the same flag in the Advanced
        config.
      components:
        memory:
          uiType: group
          groupType: bordered
          label: Context & batching
          description: >-
            Lower the context length first when vLLM fails to start with a KV
            cache or out-of-memory error.
          components:
            limits:
              uiType: group
              groupType: line
              components:
                maxModelLen:
                  uiType: number
                  path: spec.components.llmEngine.parameters.engine.maxModelLen
                  fieldParams:
                    label: Max context length
                    badge: tokens
                    placeholder: Model maximum
                    helperText: --max-model-len
                  validation:
                    min: 1
                    int: true
                maxNumSeqs:
                  uiType: number
                  path: spec.components.llmEngine.parameters.engine.maxNumSeqs
                  fieldParams:
                    label: Max concurrent sequences
                    placeholder: vLLM default
                    helperText: --max-num-seqs
                  validation:
                    min: 1
                    int: true
                gpuMemoryUtilization:
                  uiType: number
                  path: spec.components.llmEngine.parameters.engine.gpuMemoryUtilization
                  fieldParams:
                    label: GPU memory utilization
                    placeholder: vLLM default
                    step: 0.05
                    helperText: --gpu-memory-utilization, 0–1. Host memory on CPU.
                  validation:
                    min: 0.01
                    max: 1
              componentsOrder:
              - maxModelLen
              - maxNumSeqs
              - gpuMemoryUtilization
        precision:
          uiType: group
          groupType: bordered
          label: Precision
          description: >-
            Keep Quantization on vLLM default for pre-quantized checkpoints
            (AWQ, GPTQ, FP8): vLLM detects them on its own.
          components:
            types:
              uiType: group
              groupType: line
              components:
                dtype:
                  uiType: select
                  path: spec.components.llmEngine.parameters.engine.dtype
                  fieldParams:
                    label: Weights dtype
                    displayEmpty: true
                    helperText: --dtype
                    options:
                    - label: vLLM default
                      value: ""
                    - label: bfloat16
                      value: bfloat16
                    - label: float16
                      value: float16
                    - label: float32
                      value: float32
                quantization:
                  uiType: select
                  path: spec.components.llmEngine.parameters.engine.quantization
                  fieldParams:
                    label: Quantization
                    displayEmpty: true
                    helperText: --quantization
                    options:
                    - label: vLLM default
                      value: ""
                    - label: FP8 (on load, Ada/Hopper+)
                      value: fp8
                    - label: bitsandbytes 4-bit (on load)
                      value: bitsandbytes
                    - label: AWQ (Marlin)
                      value: awq_marlin
                    - label: GPTQ (Marlin)
                      value: gptq_marlin
                    - label: compressed-tensors
                      value: compressed-tensors
                kvCacheDtype:
                  uiType: select
                  path: spec.components.llmEngine.parameters.engine.kvCacheDtype
                  fieldParams:
                    label: KV cache dtype
                    displayEmpty: true
                    helperText: --kv-cache-dtype. FP8 fits about twice the tokens.
                    options:
                    - label: vLLM default
                      value: ""
                    - label: fp8
                      value: fp8
                    - label: fp8_e4m3
                      value: fp8_e4m3
                    - label: fp8_e5m2
                      value: fp8_e5m2
              componentsOrder:
              - dtype
              - quantization
              - kvCacheDtype
        toolCalling:
          uiType: group
          groupType: toggleable
          label: Tool calling
          description: >-
            Lets clients send OpenAI tools and get tool calls back. Pick the
            parser that matches the model's chat template.
          components:
            toolCallParser:
              uiType: select
              path: spec.components.llmEngine.parameters.engine.toolCallParser
              fieldParams:
                label: Tool call parser
                helperText: --enable-auto-tool-choice --tool-call-parser
                options:
                - label: hermes (Qwen 2.5, Qwen 3, Hermes)
                  value: hermes
                - label: qwen3_coder (Qwen3-Coder)
                  value: qwen3_coder
                - label: llama3_json (Llama 3.1–3.3)
                  value: llama3_json
                - label: llama4_pythonic (Llama 4)
                  value: llama4_pythonic
                - label: mistral (Mistral, Mixtral)
                  value: mistral
                - label: openai (gpt-oss)
                  value: openai
                - label: deepseek_v3 (DeepSeek-V3, R1)
                  value: deepseek_v3
                - label: deepseek_v31 (DeepSeek-V3.1)
                  value: deepseek_v31
                - label: glm45 (GLM-4.5, GLM-4.6)
                  value: glm45
                - label: kimi_k2 (Kimi K2)
                  value: kimi_k2
                - label: granite (Granite 3)
                  value: granite
                - label: granite4 (Granite 4)
                  value: granite4
                - label: gemma4 (Gemma 4)
                  value: gemma4
                - label: phi4_mini_json (Phi-4-mini)
                  value: phi4_mini_json
                - label: minimax_m2 (MiniMax-M2)
                  value: minimax_m2
                - label: xlam (xLAM)
                  value: xlam
                - label: pythonic (Llama 3.2, ToolACE)
                  value: pythonic
              validation:
                required: true
        reasoning:
          uiType: group
          groupType: toggleable
          label: Reasoning output
          description: >-
            For reasoning models: returns the model's thinking in a separate
            reasoning_content field instead of mixing it into the answer.
          components:
            reasoningParser:
              uiType: select
              path: spec.components.llmEngine.parameters.engine.reasoningParser
              fieldParams:
                label: Reasoning parser
                helperText: --reasoning-parser
                options:
                - label: qwen3 (Qwen 3)
                  value: qwen3
                - label: deepseek_r1 (DeepSeek-R1, QwQ)
                  value: deepseek_r1
                - label: deepseek_v3 (DeepSeek-V3.1)
                  value: deepseek_v3
                - label: openai_gptoss (gpt-oss)
                  value: openai_gptoss
                - label: glm45 (GLM-4.5, GLM-4.6)
                  value: glm45
                - label: kimi_k2 (Kimi K2)
                  value: kimi_k2
                - label: granite (Granite 3.2+)
                  value: granite
                - label: mistral (Magistral)
                  value: mistral
                - label: gemma4 (Gemma 4)
                  value: gemma4
                - label: minimax_m2 (MiniMax-M2)
                  value: minimax_m2
                - label: nemotron_v3 (Nemotron 3)
                  value: nemotron_v3
                - label: seed_oss (Seed-OSS)
                  value: seed_oss
              validation:
                required: true
      componentsOrder:
      - memory
      - precision
      - toolCalling
      - reasoning
    routing:
      label: Routing
      description: >-
        Configure how clients reach the model. Pick one external access path:
        a per-instance Service (ClusterIP / LoadBalancer / NodePort), or the
        shared Envoy AI Gateway (API key per model, token metering and optional
        per-key quotas).
      components:
        externalAccess:
          uiType: select
          path: spec.topology.parameters.externalAccess
          fieldParams:
            label: External access
            defaultValue: ClusterIP
            options:
            - label: ClusterIP
              value: ClusterIP
            - label: LoadBalancer
              value: LoadBalancer
            - label: NodePort
              value: NodePort
            - label: Envoy AI Gateway
              value: EnvoyAIGateway
        tokenLimitPerHour:
          uiType: number
          path: spec.topology.parameters.tokenLimitPerHour
          fieldParams:
            label: Tokens per User per Hour
            helperText: >-
              Only with Envoy AI Gateway. Leave empty for the default (1000)
              when a Redis/Valkey rate-limit backend is configured.
          validation:
            min: 1
            celExpressions:
            # cel-js throws on missing keys with "== null"; use has() instead.
            - celExpr: '!has(spec.topology.parameters.tokenLimitPerHour) || spec.topology.parameters.externalAccess == "EnvoyAIGateway"'
              message: Tokens per User per Hour requires External access = Envoy AI Gateway
      componentsOrder:
      - externalAccess
      - tokenLimitPerHour
    disaggregation:
      label: Disaggregated Serving
      description: >-
        Split prefill and decode into independently scaled deployments
        (llm-d pattern). The settings below apply to the prefill workload.
      components:
        enablePrefill:
          uiType: toggle
          path: spec.topology.parameters.enablePrefill
          fieldParams:
            label: Enable Prefill/Decode Disaggregation
            defaultValue: false
        prefillReplicas:
          uiType: number
          path: spec.topology.parameters.prefillReplicas
          fieldParams:
            label: Prefill replicas
            defaultValue: 1
            helperText: Fixed prefill replica count. Ignored while Prefill autoscaling is on.
          validation:
            min: 0
            max: 32
        prefillAutoscaling:
          uiType: group
          groupType: toggleable
          label: Prefill autoscaling
          description: >-
            Scale prefill replicas with KServe WVA. When decode also autoscales,
            both must use the same actuator.
          components:
            bounds:
              uiType: group
              groupType: line
              components:
                prefillMinReplicas:
                  uiType: number
                  path: spec.topology.parameters.prefillMinReplicas
                  fieldParams:
                    label: Prefill min replicas
                    placeholder: "1"
                  validation:
                    min: 1
                    max: 32
                    celExpressions:
                    - celExpr: '!has(spec.topology.parameters.prefillMinReplicas) || spec.topology.parameters.enablePrefill == true'
                      message: Prefill autoscaling requires Enable Prefill/Decode Disaggregation
                    - celExpr: '!has(spec.topology.parameters.prefillMinReplicas) || !has(spec.topology.parameters.prefillMaxReplicas) || spec.topology.parameters.prefillMinReplicas <= spec.topology.parameters.prefillMaxReplicas'
                      message: Prefill min replicas cannot exceed Prefill max replicas
                prefillMaxReplicas:
                  uiType: number
                  path: spec.topology.parameters.prefillMaxReplicas
                  fieldParams:
                    label: Prefill max replicas
                  validation:
                    required: true
                    min: 1
                    max: 32
                    celExpressions:
                    - celExpr: '!has(spec.topology.parameters.prefillMaxReplicas) || spec.topology.parameters.enablePrefill == true'
                      message: Prefill autoscaling requires Enable Prefill/Decode Disaggregation
              componentsOrder:
              - prefillMinReplicas
              - prefillMaxReplicas
            prefillScalingActuator:
              uiType: select
              path: spec.topology.parameters.prefillScalingActuator
              fieldParams:
                label: Prefill autoscaling actuator
                displayEmpty: true
                helperText: KEDA (default) or HPA.
                options:
                - label: KEDA
                  value: keda
                - label: HPA
                  value: hpa
          componentsOrder:
          - bounds
          - prefillScalingActuator
        prefillMultiNode:
          uiType: group
          groupType: toggleable
          label: Prefill multi-node workers
          description: >-
            Shard each prefill copy across several nodes with pipeline
            parallelism.
          components:
            sizes:
              uiType: group
              groupType: line
              components:
                prefillWorkerCount:
                  uiType: number
                  path: spec.topology.parameters.prefillWorkerCount
                  fieldParams:
                    label: Prefill worker count
                    helperText: Worker pods besides the prefill head.
                  validation:
                    required: true
                    min: 1
                    max: 16
                    celExpressions:
                    - celExpr: '!has(spec.topology.parameters.prefillWorkerCount) || spec.topology.parameters.enablePrefill == true'
                      message: Prefill workers require Enable Prefill/Decode Disaggregation
                prefillPipelineParallelSize:
                  uiType: number
                  path: spec.topology.parameters.prefillPipelineParallelSize
                  fieldParams:
                    label: Prefill pipeline parallel size
                    helperText: Must equal Prefill worker count + 1.
                  validation:
                    required: true
                    min: 1
                    max: 16
                    celExpressions:
                    - celExpr: '!has(spec.topology.parameters.prefillWorkerCount) || (has(spec.topology.parameters.prefillPipelineParallelSize) && spec.topology.parameters.prefillPipelineParallelSize == spec.topology.parameters.prefillWorkerCount + 1)'
                      message: Prefill pipeline parallel size must equal Prefill worker count + 1
              componentsOrder:
              - prefillWorkerCount
              - prefillPipelineParallelSize
            prefillWorkerResources:
              uiType: group
              groupType: line
              components:
                cpu:
                  uiType: number
                  path: spec.topology.parameters.prefillWorkerResources.limits.cpu
                  fieldParams:
                    label: Prefill worker CPU
                    placeholder: Same as head
                memory:
                  uiType: number
                  path: spec.topology.parameters.prefillWorkerResources.limits.memory
                  fieldParams:
                    label: Prefill worker Memory
                    placeholder: Same as head
                    badge: Gi
                    badgeToApi: true
              componentsOrder:
              - cpu
              - memory
          componentsOrder:
          - sizes
          - prefillWorkerResources
      componentsOrder:
      - enablePrefill
      - prefillReplicas
      - prefillAutoscaling
      - prefillMultiNode
    lora:
      label: LoRA Adapters
      description: >-
        Serve LoRA fine-tunes on top of the base model. Each adapter is
        addressable by name in OpenAI requests (model field).
      components:
        loraDeployment:
          uiType: select
          path: spec.components.llmEngine.parameters.loraDeployment
          fieldParams:
            label: LoRA deployment
            defaultValue: disabled
            options:
            - label: Base model only
              value: disabled
            - label: Base + LoRA adapters
              value: enabled
        adapters:
          uiType: group
          groupType: accordion
          label: Adapters
          components:
            loraSlot1:
              uiType: select
              path: spec.components.llmEngine.parameters.loraSlot1
              fieldParams:
                label: Adapter 1
                # An explicit empty default: without it the UI preselects the
                # first catalog entry in every slot.
                defaultValue: ""
                displayEmpty: true
                helperText: >-
                  From the operator catalog (chart loraAdapters), up to three.
                  Used when LoRA deployment is Base + LoRA adapters.
                optionsPath: spec.uiSchema.llm.loraCatalog
                optionsPathConfig:
                  labelPath: label
                  valuePath: name
            loraSlot2:
              uiType: select
              path: spec.components.llmEngine.parameters.loraSlot2
              fieldParams:
                label: Adapter 2
                defaultValue: ""
                displayEmpty: true
                optionsPath: spec.uiSchema.llm.loraCatalog
                optionsPathConfig:
                  labelPath: label
                  valuePath: name
            loraSlot3:
              uiType: select
              path: spec.components.llmEngine.parameters.loraSlot3
              fieldParams:
                label: Adapter 3
                defaultValue: ""
                displayEmpty: true
                optionsPath: spec.uiSchema.llm.loraCatalog
                optionsPathConfig:
                  labelPath: label
                  valuePath: name
          componentsOrder:
          - loraSlot1
          - loraSlot2
          - loraSlot3
        limits:
          uiType: group
          groupType: accordion
          label: Adapter limits
          components:
            values:
              uiType: group
              groupType: line
              components:
                maxRank:
                  uiType: number
                  path: spec.components.llmEngine.parameters.lora.maxRank
                  fieldParams:
                    label: Max LoRA rank
                    placeholder: vLLM default (16)
                    helperText: --max-lora-rank
                  validation:
                    min: 1
                maxAdapters:
                  uiType: number
                  path: spec.components.llmEngine.parameters.lora.maxAdapters
                  fieldParams:
                    label: Max loaded adapters
                    placeholder: Adapter count
                    helperText: --max-loras
                  validation:
                    min: 1
                maxCpuAdapters:
                  uiType: number
                  path: spec.components.llmEngine.parameters.lora.maxCpuAdapters
                  fieldParams:
                    label: Max CPU-resident adapters
                    placeholder: Adapter count
                    helperText: --max-cpu-loras
                  validation:
                    min: 1
              componentsOrder:
              - maxRank
              - maxAdapters
              - maxCpuAdapters
          componentsOrder:
          - values
      componentsOrder:
      - loraDeployment
      - adapters
      - limits
    observability:
      label: Observability
      description: >-
        Configure Prometheus metrics for this model's vLLM engine (per-instance
        PodMonitor). Envoy AI Gateway gen_ai metrics are cluster-wide: enabled
        automatically when the provider is installed with aiGateway.enabled and
        metrics.podMonitor.enabled — view them in Grafana (gateway dashboard).
      components:
        enableMetrics:
          uiType: toggle
          path: spec.topology.parameters.enableMetrics
          fieldParams:
            label: vLLM Prometheus metrics
            defaultValue: true
            helperText: >-
              Emits a PodMonitor for this instance's vLLM /metrics endpoint.
              Requires Prometheus Operator in the cluster.
        enableTracing:
          uiType: toggle
          path: spec.topology.parameters.enableTracing
          fieldParams:
            label: Distributed tracing (OTLP)
            defaultValue: false
            helperText: >-
              Enables KServe distributed tracing across the gateway, scheduler
              and model components. Requires an OpenTelemetry collector.
        tracingEndpoint:
          uiType: text
          path: spec.topology.parameters.tracingEndpoint
          fieldParams:
            label: OTLP exporter endpoint
            placeholder: http://otel-collector:4317
            helperText: >-
              Optional OTLP endpoint (OTEL_EXPORTER_OTLP_ENDPOINT). Only used
              when tracing is enabled; empty keeps KServe's default collector.
      componentsOrder:
      - enableMetrics
      - enableTracing
      - tracingEndpoint
    scheduling:
      label: Scheduling
      components:
        podSchedulingPolicy:
          uiType: group
          groupType: toggleable
          label: Pod scheduling policy
          components:
            policy:
              uiType: widget
              widgetType: podSchedulingPolicy
    advanced:
      label: Advanced
      description: >-
        Provide a custom LLMInferenceServiceConfig spec (YAML) for runtime
        settings not exposed above — other vLLM args, env vars, or scheduling.
        The provider creates a config owned by this instance and merges it via
        baseRefs; it overrides the compute-profile preset, while the structured
        fields above still take precedence. Enter only the config spec body.
      components:
        config:
          uiType: text
          path: spec.components.llmEngine.parameters.config
          fieldParams:
            label: LLMInferenceServiceConfig (spec)
            multiline: true
            minRows: 4
            maxRows: 20
            placeholder: |2
              template:
                containers:
                  - name: main
                    args:
                      - --enforce-eager
                      - --enable-prefix-caching
      componentsOrder:
      - config
  sectionsOrder:
  - basicInfo
  - scaling
  - runtime
  - cache
  - engine
  - lora
  - routing
  - disaggregation
  - observability
  - scheduling
  - advanced
