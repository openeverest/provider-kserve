# Llm topology definition.
# Wraps KServe LLMInferenceService (serving.kserve.io/v1alpha2) — the flagship
# path for serving Large Language Models with vLLM, tensor/pipeline parallelism,
# optional disaggregated prefill/decode, and Gateway API inference routing.
#
# config.components: Which components are used and their defaults.
# config.parametersSchema: Reference a Go type for topology parameters.
# ui: Rendering hints for the frontend form.
#
# See github.com/openeverest/provider-sdk/blob/main/PROVIDER_DEVELOPMENT.md
# for detailed guidance.
config:
  parametersSchema: LlmTopologyParameters
  components:
    llmEngine:
      defaults:
        replicas: 1
ui:
  sections:
    basicInfo:
      label: Basic Information
      description: Configure the model to serve.
      components:
        modelURI:
          uiType: select
          path: spec.components.llmEngine.parameters.modelURI
          fieldParams:
            label: Model
            # Options are loaded from spec.uiSchema.llm.modelCatalog on the
            # Provider CR, populated from the chart's `.Values.models` at install
            # time. spec.uiSchema is a PreserveUnknownFields region in the
            # Provider CRD, so the injected catalog survives apiserver pruning (a
            # plain spec.modelCatalog field would be dropped as unknown). It is
            # nested inside the `llm` topology node so it is not enumerated as a
            # selectable topology in the UI's topology dropdown. Operators
            # customize the catalog without regenerating this schema.
            optionsPath: spec.uiSchema.llm.modelCatalog
            optionsPathConfig:
              labelPath: label
              valuePath: uri
          validation:
            required: true
        modelName:
          uiType: text
          path: spec.components.llmEngine.parameters.modelName
          fieldParams:
            label: Served Model Name
            placeholder: Defaults to the instance name
        version:
          uiType: select
          path: spec.components.llmEngine.version
          fieldParams:
            label: vLLM Runtime Version
            optionsPath: spec.componentTypes.vllm.versions
            optionsPathConfig:
              labelPath: version
              valuePath: version
          validation:
            required: true
      componentsOrder:
      - modelURI
      - modelName
      - version
    scaling:
      label: Scaling & Parallelism
      description: >-
        Fixed replica count, or WVA autoscaling (KV-cache / queue-depth) via
        min/max. Autoscaling ignores Replicas. KServe minReplicas is ≥ 1
        (no scale-to-zero).
      components:
        replicas:
          uiType: number
          path: spec.components.llmEngine.replicas
          fieldParams:
            label: Replicas
            defaultValue: 1
            helperText: Fixed decode replica count. Ignored when Min/Max replicas are set.
          validation:
            min: 0
            max: 32
        minReplicas:
          uiType: number
          path: spec.components.llmEngine.parameters.minReplicas
          fieldParams:
            label: Min replicas
            helperText: Autoscaling floor (KServe WVA). Enables autoscaling; must be ≥ 1.
          validation:
            min: 1
            max: 32
            celExpressions:
            - celExpr: '!has(spec.components.llmEngine.parameters.minReplicas) || !has(spec.components.llmEngine.parameters.maxReplicas) || spec.components.llmEngine.parameters.minReplicas <= spec.components.llmEngine.parameters.maxReplicas'
              message: Min replicas cannot exceed Max replicas
        maxReplicas:
          uiType: number
          path: spec.components.llmEngine.parameters.maxReplicas
          fieldParams:
            label: Max replicas
            helperText: Autoscaling ceiling. Required to enable WVA autoscaling on decode.
          validation:
            min: 1
            max: 32
        scalingActuator:
          uiType: select
          path: spec.components.llmEngine.parameters.scalingActuator
          fieldParams:
            label: Autoscaling actuator
            displayEmpty: true
            helperText: >-
              Used when Min/Max replicas are set. KEDA (default) queries
              Prometheus directly; HPA needs a Prometheus Adapter.
            options:
            - label: KEDA
              value: keda
            - label: HPA
              value: hpa
          validation:
            celExpressions:
            - celExpr: '!has(spec.components.llmEngine.parameters.scalingActuator) || has(spec.components.llmEngine.parameters.maxReplicas) || has(spec.components.llmEngine.parameters.minReplicas)'
              message: Autoscaling actuator requires Min or Max replicas
        tensorParallelSize:
          uiType: number
          path: spec.components.llmEngine.parameters.tensorParallelSize
          fieldParams:
            label: Tensor Parallel Size
            defaultValue: 1
          validation:
            min: 1
            max: 16
        pipelineParallelSize:
          uiType: number
          path: spec.components.llmEngine.parameters.pipelineParallelSize
          fieldParams:
            label: Pipeline Parallel Size
            defaultValue: 1
            helperText: >-
              Stages in one sharded model. When Worker count is set this must
              equal Worker count + 1 (head plus workers).
          validation:
            min: 1
            max: 16
        workerCount:
          uiType: number
          path: spec.components.llmEngine.parameters.workerCount
          fieldParams:
            label: Worker count
            helperText: >-
              Extra decode nodes besides the head (one sharded model). Turns on
              KServe spec.worker. Must equal Pipeline parallel size − 1.
              Replicas/min/max still count whole head+worker rings.
          validation:
            min: 1
            max: 16
            celExpressions:
            - celExpr: '!has(spec.components.llmEngine.parameters.workerCount) || (has(spec.components.llmEngine.parameters.pipelineParallelSize) && spec.components.llmEngine.parameters.pipelineParallelSize == spec.components.llmEngine.parameters.workerCount + 1)'
              message: Pipeline parallel size must equal Worker count + 1
        workerResources:
          uiType: group
          groupType: line
          components:
            cpu:
              uiType: number
              path: spec.components.llmEngine.parameters.workerResources.limits.cpu
              fieldParams:
                label: Worker CPU
                helperText: Optional. Empty copies the head resources.
            memory:
              uiType: number
              path: spec.components.llmEngine.parameters.workerResources.limits.memory
              fieldParams:
                label: Worker Memory
                badge: Gi
                badgeToApi: true
          validation:
            celExpressions:
            - celExpr: '!has(spec.components.llmEngine.parameters.workerResources) || has(spec.components.llmEngine.parameters.workerCount)'
              message: Worker resources require Worker count
        dataParallelSize:
          uiType: number
          path: spec.components.llmEngine.parameters.dataParallelSize
          fieldParams:
            label: Data Parallel Size
            defaultValue: 1
          validation:
            min: 1
            max: 16
        expertParallel:
          uiType: select
          path: spec.components.llmEngine.parameters.expertParallel
          fieldParams:
            label: Expert Parallelism (MoE)
            defaultValue: disabled
            options:
            - label: Disabled
              value: disabled
            - label: Enabled
              value: enabled
    runtime:
      label: Runtime
      description: Choose the compute profile and size the model server. GPU uses the default CUDA vLLM image; CPU composes a CPU-only vLLM config (via baseRefs) so the model runs without a GPU. CPU/Memory are applied to the model server container per instance.
      components:
        computeProfile:
          uiType: select
          path: spec.components.llmEngine.parameters.computeProfile
          fieldParams:
            label: Compute Profile
            defaultValue: gpu
            options:
            - label: GPU (default)
              value: gpu
            - label: CPU
              value: cpu
        resources:
          uiType: group
          groupType: line
          components:
            cpu:
              uiType: number
              # Written to the standard component resources field, which the
              # provider applies to the LLMInferenceService "main" container.
              # KServe strategic-merges the instance spec last, so this wins over
              # the preset/baseRefs — a per-instance, finetuned resource sizing.
              path: spec.components.llmEngine.resources.limits.cpu
              fieldParams:
                label: CPU
                defaultValue: 2
                step: 1
              validation:
                min: 0.5
                required: true
            memory:
              uiType: number
              path: spec.components.llmEngine.resources.limits.memory
              fieldParams:
                label: Memory
                badge: Gi
                badgeToApi: true
                defaultValue: 16
                step: 1
              validation:
                min: 1
                required: true
        kvCacheSpaceGi:
          uiType: number
          # CPU profile only. Overrides VLLM_CPU_KVCACHE_SPACE (GiB). Left empty,
          # vLLM auto-sizes the KV cache from the memory that is free at startup,
          # which adapts to the node — recommended. Only set this to cap the KV
          # cache to a specific size; vLLM refuses to start if it exceeds the
          # host-free memory at that moment (the CPU runtime footprint is large
          # and model-independent), so keep it small unless Memory is generous.
          path: spec.components.llmEngine.parameters.kvCacheSpaceGi
          fieldParams:
            label: CPU KV Cache Space
            badge: Gi
            placeholder: Auto (vLLM sizes from free memory)
          validation:
            min: 1
      componentsOrder:
      - computeProfile
      - resources
      - kvCacheSpaceGi
    routing:
      label: Routing
      description: >-
        Configure how clients reach the model. Pick one external access path:
        a per-instance Service (ClusterIP / LoadBalancer / NodePort), or the
        shared Envoy AI Gateway (token metering and optional per-user quotas).
      components:
        externalAccess:
          uiType: select
          path: spec.topology.parameters.externalAccess
          fieldParams:
            label: External access
            defaultValue: ClusterIP
            options:
            - label: ClusterIP
              value: ClusterIP
            - label: LoadBalancer
              value: LoadBalancer
            - label: NodePort
              value: NodePort
            - label: Envoy AI Gateway
              value: EnvoyAIGateway
        tokenLimitPerHour:
          uiType: number
          path: spec.topology.parameters.tokenLimitPerHour
          fieldParams:
            label: Tokens per User per Hour
            helperText: >-
              Only with Envoy AI Gateway. Leave empty for the default (1000)
              when a Redis/Valkey rate-limit backend is configured.
          validation:
            min: 1
            celExpressions:
            # cel-js throws on missing keys with "== null"; use has() instead.
            - celExpr: '!has(spec.topology.parameters.tokenLimitPerHour) || spec.topology.parameters.externalAccess == "EnvoyAIGateway"'
              message: Tokens per User per Hour requires External access = Envoy AI Gateway
      componentsOrder:
      - externalAccess
      - tokenLimitPerHour
    disaggregation:
      label: Disaggregated Serving
      description: Split prefill and decode into independently scaled deployments (llm-d pattern).
      components:
        enablePrefill:
          uiType: select
          path: spec.topology.parameters.enablePrefill
          fieldParams:
            label: Enable Prefill/Decode Disaggregation
            defaultValue: "false"
            options:
            - label: Disabled
              value: "false"
            - label: Enabled
              value: "true"
        prefillReplicas:
          uiType: number
          path: spec.topology.parameters.prefillReplicas
          fieldParams:
            label: Prefill Replicas
            defaultValue: 1
            helperText: Fixed prefill replica count. Ignored when Prefill min/max replicas are set.
          validation:
            min: 0
            max: 32
        prefillMinReplicas:
          uiType: number
          path: spec.topology.parameters.prefillMinReplicas
          fieldParams:
            label: Prefill min replicas
            helperText: Prefill WVA floor. Enables prefill autoscaling; must be ≥ 1.
          validation:
            min: 1
            max: 32
            celExpressions:
            - celExpr: '!has(spec.topology.parameters.prefillMinReplicas) || spec.topology.parameters.enablePrefill == "true"'
              message: Prefill min replicas requires Enable Prefill/Decode Disaggregation
            - celExpr: '!has(spec.topology.parameters.prefillMinReplicas) || !has(spec.topology.parameters.prefillMaxReplicas) || spec.topology.parameters.prefillMinReplicas <= spec.topology.parameters.prefillMaxReplicas'
              message: Prefill min replicas cannot exceed Prefill max replicas
        prefillMaxReplicas:
          uiType: number
          path: spec.topology.parameters.prefillMaxReplicas
          fieldParams:
            label: Prefill max replicas
            helperText: Prefill WVA ceiling. Required to enable prefill autoscaling.
          validation:
            min: 1
            max: 32
            celExpressions:
            - celExpr: '!has(spec.topology.parameters.prefillMaxReplicas) || spec.topology.parameters.enablePrefill == "true"'
              message: Prefill max replicas requires Enable Prefill/Decode Disaggregation
        prefillScalingActuator:
          uiType: select
          path: spec.topology.parameters.prefillScalingActuator
          fieldParams:
            label: Prefill autoscaling actuator
            displayEmpty: true
            helperText: >-
              Must match decode actuator when both sides autoscale. KEDA
              (default) or HPA.
            options:
            - label: KEDA
              value: keda
            - label: HPA
              value: hpa
          validation:
            celExpressions:
            - celExpr: '!has(spec.topology.parameters.prefillScalingActuator) || spec.topology.parameters.enablePrefill == "true"'
              message: Prefill autoscaling actuator requires Enable Prefill/Decode Disaggregation
            - celExpr: '!has(spec.topology.parameters.prefillScalingActuator) || has(spec.topology.parameters.prefillMaxReplicas) || has(spec.topology.parameters.prefillMinReplicas)'
              message: Prefill autoscaling actuator requires Prefill min or max replicas
        prefillPipelineParallelSize:
          uiType: number
          path: spec.topology.parameters.prefillPipelineParallelSize
          fieldParams:
            label: Prefill pipeline parallel size
            helperText: Prefill stages. Required when Prefill worker count is set (must equal count + 1).
          validation:
            min: 1
            max: 16
            celExpressions:
            - celExpr: '!has(spec.topology.parameters.prefillPipelineParallelSize) || spec.topology.parameters.enablePrefill == "true"'
              message: Prefill pipeline parallel size requires Enable Prefill/Decode Disaggregation
        prefillWorkerCount:
          uiType: number
          path: spec.topology.parameters.prefillWorkerCount
          fieldParams:
            label: Prefill worker count
            helperText: Extra prefill nodes besides the prefill head. Turns on spec.prefill.worker.
          validation:
            min: 1
            max: 16
            celExpressions:
            - celExpr: '!has(spec.topology.parameters.prefillWorkerCount) || spec.topology.parameters.enablePrefill == "true"'
              message: Prefill worker count requires Enable Prefill/Decode Disaggregation
            - celExpr: '!has(spec.topology.parameters.prefillWorkerCount) || (has(spec.topology.parameters.prefillPipelineParallelSize) && spec.topology.parameters.prefillPipelineParallelSize == spec.topology.parameters.prefillWorkerCount + 1)'
              message: Prefill pipeline parallel size must equal Prefill worker count + 1
        prefillWorkerResources:
          uiType: group
          groupType: line
          components:
            cpu:
              uiType: number
              path: spec.topology.parameters.prefillWorkerResources.limits.cpu
              fieldParams:
                label: Prefill worker CPU
            memory:
              uiType: number
              path: spec.topology.parameters.prefillWorkerResources.limits.memory
              fieldParams:
                label: Prefill worker Memory
                badge: Gi
                badgeToApi: true
          validation:
            celExpressions:
            - celExpr: '!has(spec.topology.parameters.prefillWorkerResources) || has(spec.topology.parameters.prefillWorkerCount)'
              message: Prefill worker resources require Prefill worker count
      componentsOrder:
      - enablePrefill
      - prefillReplicas
      - prefillMinReplicas
      - prefillMaxReplicas
      - prefillScalingActuator
      - prefillPipelineParallelSize
      - prefillWorkerCount
      - prefillWorkerResources
    lora:
      label: LoRA Adapters
      description: >-
        Serve LoRA fine-tunes on top of the base model. Each adapter is
        addressable by name in OpenAI requests (model field). Adapters are
        chosen from the operator catalog (chart loraAdapters); up to three
        per Instance.
      components:
        loraDeployment:
          uiType: select
          path: spec.components.llmEngine.parameters.loraDeployment
          fieldParams:
            label: LoRA deployment
            defaultValue: disabled
            options:
            - label: Base model only
              value: disabled
            - label: Base + LoRA adapters
              value: enabled
        loraSlot1:
          uiType: select
          path: spec.components.llmEngine.parameters.loraSlot1
          fieldParams:
            label: Adapter 1
            displayEmpty: true
            helperText: Optional. Served model name comes from the catalog entry.
            optionsPath: spec.uiSchema.llm.loraCatalog
            optionsPathConfig:
              labelPath: label
              valuePath: name
        loraSlot2:
          uiType: select
          path: spec.components.llmEngine.parameters.loraSlot2
          fieldParams:
            label: Adapter 2
            displayEmpty: true
            optionsPath: spec.uiSchema.llm.loraCatalog
            optionsPathConfig:
              labelPath: label
              valuePath: name
        loraSlot3:
          uiType: select
          path: spec.components.llmEngine.parameters.loraSlot3
          fieldParams:
            label: Adapter 3
            displayEmpty: true
            optionsPath: spec.uiSchema.llm.loraCatalog
            optionsPathConfig:
              labelPath: label
              valuePath: name
        maxRank:
          uiType: number
          path: spec.components.llmEngine.parameters.lora.maxRank
          fieldParams:
            label: Max LoRA Rank
            placeholder: vLLM default (16)
            helperText: Maps to vLLM --max-lora-rank
          validation:
            min: 1
        maxAdapters:
          uiType: number
          path: spec.components.llmEngine.parameters.lora.maxAdapters
          fieldParams:
            label: Max Loaded Adapters
            placeholder: Defaults to adapter count
            helperText: Maps to vLLM --max-loras
          validation:
            min: 1
        maxCpuAdapters:
          uiType: number
          path: spec.components.llmEngine.parameters.lora.maxCpuAdapters
          fieldParams:
            label: Max CPU-resident Adapters
            placeholder: Defaults to adapter count
            helperText: Maps to vLLM --max-cpu-loras
          validation:
            min: 1
      componentsOrder:
      - loraDeployment
      - loraSlot1
      - loraSlot2
      - loraSlot3
      - maxRank
      - maxAdapters
      - maxCpuAdapters
    observability:
      label: Observability
      description: >-
        Configure Prometheus metrics for this model's vLLM engine (per-instance
        PodMonitor). Envoy AI Gateway gen_ai metrics are cluster-wide: enabled
        automatically when the provider is installed with aiGateway.enabled and
        metrics.podMonitor.enabled — view them in Grafana (gateway dashboard).
      components:
        enableMetrics:
          uiType: select
          path: spec.topology.parameters.enableMetrics
          fieldParams:
            label: vLLM Prometheus metrics
            defaultValue: "true"
            helperText: >-
              Emits a PodMonitor for this instance's vLLM /metrics endpoint.
              Requires Prometheus Operator in the cluster.
            options:
            - label: Enabled
              value: "true"
            - label: Disabled
              value: "false"
        enableTracing:
          uiType: select
          path: spec.topology.parameters.enableTracing
          fieldParams:
            label: Distributed tracing (OTLP)
            defaultValue: "false"
            helperText: >-
              Enables KServe distributed tracing across the gateway, scheduler
              and model components. Requires an OpenTelemetry collector.
            options:
            - label: Disabled
              value: "false"
            - label: Enabled
              value: "true"
        tracingEndpoint:
          uiType: text
          path: spec.topology.parameters.tracingEndpoint
          fieldParams:
            label: OTLP exporter endpoint
            placeholder: http://otel-collector:4317
            helperText: >-
              Optional OTLP endpoint (OTEL_EXPORTER_OTLP_ENDPOINT). Only used
              when tracing is enabled; empty keeps KServe's default collector.
      componentsOrder:
      - enableMetrics
      - enableTracing
      - tracingEndpoint
    advanced:
      label: Advanced
      description: >-
        Provide a custom LLMInferenceServiceConfig spec (YAML) for runtime
        settings not exposed above — extra vLLM args, env vars, or scheduling.
        The provider creates a config owned by this instance and merges it via
        baseRefs; it overrides the compute-profile preset, while the structured
        fields above still take precedence. Enter only the config spec body.
      components:
        config:
          uiType: text
          path: spec.components.llmEngine.parameters.config
          fieldParams:
            label: LLMInferenceServiceConfig (spec)
            multiline: true
            minRows: 4
            maxRows: 20
            placeholder: |2
              template:
                containers:
                  - name: main
                    args:
                      - --enforce-eager
                      - --max-model-len=2048
      componentsOrder:
      - config
  sectionsOrder:
  - basicInfo
  - scaling
  - runtime
  - lora
  - routing
  - disaggregation
  - observability
  - advanced
