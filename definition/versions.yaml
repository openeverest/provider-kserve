# Component type version catalog and version bundles.
#
# This file must describe what the chart actually installs. The chart pins the
# KServe subcharts in charts/provider-kserve/Chart.yaml; a bundle here that
# names a different KServe version is a claim the provider cannot honour.
# TestCatalogMatchesChart (internal/common/versions_test.go) fails the build
# when the two drift, so bump this file in the same PR as the subcharts.
#
# Name the default version per type and the default bundle via `defaultVersion`.
#
# Note: these images are catalog metadata surfaced to the UI version picker and
# used for bundle resolution; they are not injected into the CRs directly.
# KServe auto-selects the ServingRuntime container for the predictor from the
# model format, and the llmEngine runtime is managed by the LLMInferenceService
# controller through the bundled presets.

componentTypes:
  vllm:
    defaultVersion: "0.26.0"
    versions:
      # The vLLM in the bundled GPU presets' runtime image (llm-d v0.9.0 ships
      # vLLM 0.26.0 as of KServe v0.21.0). The CPU profile runs its own build,
      # cpuProfile.image in charts/provider-kserve/values.yaml.
      - version: "0.26.0"
        image: ghcr.io/llm-d/llm-d-cuda:v0.9.0
  modelServer:
    defaultVersion: "0.21.0"
    versions:
      - version: "0.21.0"
        image: kserve/kserve-controller:v0.21.0

# Version bundles: curated, mutually compatible sets keyed to a KServe release.
#
# One bundle, because the chart bundles exactly one set of KServe controllers.
# Offering a choice the chart cannot install would be fiction. Add a bundle here
# only when the chart can actually deliver it.
defaultVersion: "0.21"
versions:
  - name: "0.21"
    components:
      llmEngine: "0.26.0"
      predictor: "0.21.0"
  # Instances created before the v0.21 upgrade froze "0.20" in status.version,
  # and the runtime fails them if the name disappears. They now run on 0.21.
  - name: "0.20"
    components:
      llmEngine: "0.26.0"
      predictor: "0.21.0"
